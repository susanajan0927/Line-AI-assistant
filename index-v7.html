<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 95px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }
        .header-section {
            position: relative;
            padding-top: 8px;
            min-height: 105px;
            display: flex;
            align-items: center;
        }
        .greeting-box {
            max-width: 62%;
            z-index: 2;
        }
        .greeting-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .greeting-sub {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2563eb;
            font-weight: 500;
        }
        .robot-illustration {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 135px;
            height: 135px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.55) 0%, rgba(255, 255, 255, 0) 72%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .robot-svg {
            width: 112px;
            height: 112px;
            filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.18));
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 2;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            color: #1e40af;
        }
        .card-date {
            font-size: 0.9rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.02rem;
            color: #1e3a8a;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            padding-right: 8px;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.88rem;
            color: #2563eb;
            font-weight: 500;
            white-space: nowrap;
        }
        .status-bar {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(219, 234, 254, 0.55);
            border-radius: 14px;
            font-size: 14px;
            color: #1e3a8a;
            line-height: 1.45;
            min-height: 44px;
            word-break: break-word;
            white-space: pre-line;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .reminder-bell {
            position: absolute;
            left: -6px;
            top: 12px;
            font-size: 1.4rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.85rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
        }
        .reminder-time {
            font-size: 1.7rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
            white-space: nowrap;
        }
        .reminder-divider {
            width: 2px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        .reminder-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0 15px 0;
            gap: 12px;
            position: relative;
            z-index: 20;
        }
        .mic-btn {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .mic-btn:active {
            transform: scale(0.94);
        }
        .mic-icon {
            width: 44px;
            height: 44px;
            fill: #ffffff;
            pointer-events: none;
        }
        .mic-btn.recording {
            animation: pulse-red 1.5s infinite;
            background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%);
        }
        .mic-btn.confirming {
            animation: pulse-teal 1.5s infinite;
            background: radial-gradient(circle, #2ed573 0%, #1ea896 100%);
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 22px rgba(255, 71, 87, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); transform: scale(1); }
        }
        @keyframes pulse-teal {
            0% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 22px rgba(30, 168, 150, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0); transform: scale(1); }
        }
        .voice-hint-text {
            font-size: 0.92rem;
            color: #2563eb;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-hint-text::before, .voice-hint-text::after {
            content: "";
            width: 15px;
            height: 2px;
            background-color: #bfdbfe;
            display: inline-block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 72px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        .nav-item i {
            font-size: 1.25rem;
        }
        .nav-item.active {
            color: #2563eb;
        }
    </style>
</head>
<body>
<div class="phone-container">
    <header class="header-section">
        <div class="greeting-box">
            <h1 class="greeting-title" id="greetingTitle">早安！ 💙</h1>
            <p class="greeting-sub" id="subTitle">今天也要加油喔！<br>點擊麥克風後開始說話...</p>
        </div>
        <div class="robot-illustration">
            <svg class="robot-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <line x1="60" y1="22" x2="60" y2="10" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
                <circle cx="60" cy="8" r="5" fill="#3b82f6"/>
                <rect x="18" y="42" width="12" height="28" rx="6" fill="#3b82f6"/>
                <rect x="90" y="42" width="12" height="28" rx="6" fill="#3b82f6"/>
                <path d="M 24 46 C 24 22, 96 22, 96 46" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
                <rect x="28" y="26" width="64" height="54" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
                <rect x="36" y="35" width="48" height="34" rx="14" fill="#1e293b"/>
                <path d="M 44 50 Q 49 43 54 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M 66 50 Q 71 43 76 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
                <ellipse cx="43" cy="56" rx="4" ry="2.5" fill="#fb7185" opacity="0.8"/>
                <ellipse cx="77" cy="56" rx="4" ry="2.5" fill="#fb7185" opacity="0.8"/>
                <path d="M 55 57 Q 60 63 65 57" fill="#fb7185"/>
                <path d="M 40 82 C 40 76, 80 76, 80 82 L 84 102 C 84 107, 36 107, 36 102 Z" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
                <circle cx="60" cy="92" r="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
                <path d="M 60 87 L 60 93 M 56 91 C 56 95, 64 95, 64 91 M 60 95 L 60 97" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <circle cx="38" cy="84" r="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
                <circle cx="82" cy="84" r="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
            </svg>
        </div>
    </header>
    
    <main class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.3rem;"></i> 今日待辦</div>
            <div class="card-date" id="current-date">載入中...</div>
        </div>
        <div class="todo-list" id="todo-container"><p style="color: var(--text-muted); font-size: 0.9rem;">正在同步最新行程...</p></div>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="result" class="result-box">識別結果與解析會顯示在這裡...</div>
    </main>
    
    <div class="reminder-card">
        <div class="reminder-bell">🔔</div>
        <div class="reminder-body">
            <div class="reminder-label">下一個提醒</div>
            <div class="reminder-content-flex">
                <div class="reminder-time" id="next-time">--:--</div>
                <div class="reminder-divider"></div>
                <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                <div class="badge-upcoming">距離最近</div>
            </div>
        </div>
    </div>
    
    <div class="voice-section">
        <button type="button" class="mic-btn" id="micButton">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
        </button>
        <div class="voice-hint-text" id="voiceHint">點擊麥克風開始</div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHkvhdCOh3s834JA35-v44hMQvvcxagEjLuxiyVjeQAqfsow1Zq2c32zUl1XyBJPIMTg/exec";
    const STORAGE_KEY = "ai_assistant_todos_v7";
    
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    const greetingTitle = document.getElementById('greetingTitle');
    
    let recognition = null; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;
    let silenceTimer = null;
    let accumulatedFinalText = "";
    let latestTranscript = "";
    let manualStop = false;

    function updateGreetingByTime() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) {
            greetingTitle.innerHTML = '早安！ 💙';
            subTitle.innerHTML = '今天也要加油喔！<br>點擊麥克風後開始說話...';
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerHTML = '午安！ ☀️';
            subTitle.innerHTML = '下午也要保持活力喔！<br>有什麼需要我幫忙的嗎？';
        } else {
            greetingTitle.innerHTML = '晚安！ 🌙';
            subTitle.innerHTML = '辛苦一天了！<br>明天有什麼行程要記錄嗎？';
        }
    }

    function timeToMinutes(timeStr) {
        if (!timeStr || !timeStr.includes(':')) return 9999;
        const parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function renderTodoListAndReminder(todos) {
        todoContainer.innerHTML = '';
        todos.forEach((todo, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'todo-item';
            itemDiv.innerHTML = `
                <div class="todo-left">
                    <div class="todo-checkbox ${todo.done ? 'checked' : ''}" data-idx="${index}">
                        ${todo.done ? '<i class="fa-solid fa-check"></i>' : ''}
                    </div>
                    <span class="todo-text ${todo.done ? 'completed' : ''}">${todo.title}</span>
                </div>
                ${todo.time ? `<div class="todo-time">${todo.time}</div>` : ''}
            `;
            itemDiv.querySelector('.todo-checkbox').addEventListener('click', function() {
                todos[index].done = !todos[index].done;
                saveTodosToLocal(todos);
                renderTodoListAndReminder(todos);
            });
            todoContainer.appendChild(itemDiv);
        });

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        const upcomingList = todos
            .filter(t => !t.done && t.time && t.time.includes(':'))
            .map(t => ({ ...t, mins: timeToMinutes(t.time) }))
            .filter(t => t.mins >= currentMinutes)
            .sort((a, b) => a.mins - b.mins);

        if (upcomingList.length > 0) {
            document.getElementById('next-time').innerText = upcomingList[0].time;
            document.getElementById('next-task').innerText = upcomingList[0].title;
        } else {
            const anyUnfinished = todos.filter(t => !t.done && t.time && t.time.includes(':'));
            if (anyUnfinished.length > 0) {
                document.getElementById('next-time').innerText = anyUnfinished[0].time;
                document.getElementById('next-task').innerText = anyUnfinished[0].title;
            } else {
                document.getElementById('next-time').innerText = "--:--";
                document.getElementById('next-task').innerText = "今日提醒已全數完成 ✨";
            }
        }
    }

    function getLocalTodos() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                const todayStr = new Date().toDateString();
                if (parsed.dateStr === todayStr && Array.isArray(parsed.todos)) {
                    return parsed.todos;
                }
            }
        } catch (e) {}
        return null;
    }

    function saveTodosToLocal(todos) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                dateStr: new Date().toDateString(),
                todos: todos
            }));
        } catch (e) {}
    }

    async function fetchAndRenderTodos() {
        const localTodos = getLocalTodos();
        if (localTodos && localTodos.length > 0) {
            renderTodoListAndReminder(localTodos);
        }

        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && data.todos && data.todos.length > 0) {
                if (data.date) document.getElementById('current-date').innerText = data.date;
                saveTodosToLocal(data.todos);
                renderTodoListAndReminder(data.todos);
            } else if (!localTodos) {
                loadDefaultTodos();
            }
        } catch (error) {
            if (!localTodos) {
                loadDefaultTodos();
            }
        }
    }

    function loadDefaultTodos() {
        const defaultTodos = [
            { title: "開會討論專案進度", time: "09:30", done: false }, 
            { title: "閱讀一本好書 💕", time: "", done: true }, 
            { title: "運動 30 分鐘", time: "18:00", done: false }, 
            { title: "準備晚餐", time: "19:30", done: false }
        ];
        saveTodosToLocal(defaultTodos);
        renderTodoListAndReminder(defaultTodos);
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "⚠️ 請改用 Safari 或 Chrome 開啟以使用語音功能";
            voiceHint.innerText = "目前瀏覽器不支援語音";
            return false;
        }
        
        recognition = new SpeechRecognition(); 
        recognition.lang = 'zh-TW';
        recognition.interimResults = true;
        
        recognition.onstart = () => {
            isRecording = true;
            manualStop = false;
            accumulatedFinalText = "";
            latestTranscript = "";
            
            if (isConfirmStage) { 
                micButton.classList.remove('recording'); 
                micButton.classList.add('confirming'); 
                statusText.innerText = "請回答「對」或「不對」..."; 
                voiceHint.innerText = "聆聽確認語音中"; 
            } else { 
                micButton.classList.remove('confirming'); 
                micButton.classList.add('recording'); 
                statusText.innerText = "正在聆聽中，請說話（停頓 2.2 秒自動完成）..."; 
                voiceHint.innerText = "說話中... 點擊按鈕可立即結束"; 
                resultText.innerText = "🎙️ 等待收音中...";
            }
        };
        
        recognition.onresult = (event) => {
            let finalChunk = "";
            let interimChunk = "";
            
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcriptPart = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalChunk += transcriptPart;
                } else {
                    interimChunk += transcriptPart;
                }
            }
            
            if (finalChunk) {
                accumulatedFinalText += finalChunk;
            }
            
            const currentFullText = (accumulatedFinalText + interimChunk).trim();
            if (currentFullText) {
                latestTranscript = currentFullText;
                if (!isConfirmStage) {
                    resultText.innerText = "🎙️ 即時字幕：" + latestTranscript;
                } else {
                    resultText.innerText = "🎙️ 確認回答：" + latestTranscript;
                }
            }

            if (isConfirmStage) {
                if (finalChunk.trim()) {
                    clearTimeout(silenceTimer);
                    recognition.stop();
                }
            } else {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (isRecording) {
                        recognition.stop();
                    }
                }, 2200);
            }
        };

        recognition.onend = () => { 
            isRecording = false; 
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording'); 
            micButton.classList.remove('confirming'); 
            
            const finalText = latestTranscript.trim();
            if (!finalText) {
                if (!manualStop) {
                    statusText.innerText = "未偵測到語音，請再試一次";
                    voiceHint.innerText = "點擊麥克風開始";
                }
                return;
            }

            if (isConfirmStage) {
                handleConfirmation(finalText);
            } else {
                resultText.innerText = "聽到指令：" + finalText;
                parseCommand(finalText);
            }
        };
        
        recognition.onerror = (event) => { 
            isRecording = false;
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording');
            micButton.classList.remove('confirming');
            if (event.error === 'not-allowed') {
                statusText.innerText = "❌ 麥克風權限被拒絕，請至瀏覽器設定開啟權限";
            } else if (event.error === 'no-speech') {
                statusText.innerText = "未聽到聲音，請點擊麥克風再試一次";
            } else {
                statusText.innerText = "語音識別出錯 (" + event.error + ")，請再試一次"; 
            }
            voiceHint.innerText = "點擊麥克風開始";
        };
        return true;
    }

    micButton.addEventListener('click', (e) => {
        e.preventDefault();
        if (!recognition && !initSpeechRecognition()) {
            return;
        }
        if (isRecording) { 
            manualStop = true;
            clearTimeout(silenceTimer);
            recognition.stop(); 
        } else { 
            recognition.continuous = !isConfirmStage;
            try {
                recognition.start(); 
            } catch (err) {
                recognition.stop();
                setTimeout(() => recognition.start(), 200);
            }
        } 
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message); 
            utterance.lang = 'zh-TW'; 
            utterance.rate = 1.0;
            if (callback) { utterance.onend = callback; }
            window.speechSynthesis.speak(utterance);
        } else if (callback) { callback(); }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意..."; 
        let pendingData = null;
        
        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) { 
                const amount = amountMatch[0]; 
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim(); 
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text }; 
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0]; 
            let timeStr = "09:00";
            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) { 
                const currentYear = new Date().getFullYear(); 
                dateStr = `${currentYear}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`; 
            } else if (text.includes("明天")) { 
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); 
                dateStr = tomorrow.toISOString().split('T')[0]; 
            }
            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) { 
                let hour = parseInt(timeMatch[1], 10); 
                let minute = timeMatch[2] ? timeMatch[2].padStart(2, '0') : "00"; 
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) { hour += 12; } 
                timeStr = `${hour.toString().padStart(2, '0')}:${minute}`; 
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }
        
        if (pendingData) {
            savedPendingData = pendingData; 
            isConfirmStage = true; 
            statusText.innerText = "🔊 正在語音確認中..."; 
            voiceHint.innerText = "請準備回答對或不對";
            const askMsg = `確認內容，請問是要記錄：${text}，對嗎？`; 
            speak(askMsg, () => { 
                if (!isRecording) { 
                    recognition.continuous = false;
                    recognition.start(); 
                } 
            });
        } else { 
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。"; 
            speak("抱歉，我沒有聽懂，請重新說一次。"); 
            voiceHint.innerText = "點擊麥克風重新開始"; 
        }
    }

    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            voiceHint.innerText = "點擊麥克風重新開始";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial();
            });
            return;
        }

        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial();
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            voiceHint.innerText = "同步至後端中";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording) {
                    recognition.continuous = false;
                    recognition.start();
                }
            });
        }
    }

    function resetToInitial() {
        isConfirmStage = false;
        savedPendingData = null;
        statusText.innerText = "準備就緒";
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
    }

    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]\n類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "\n內容: " + data.content;
            
            if (data.mode === 'reminder') {
                const currentTodos = getLocalTodos() || [];
                currentTodos.push({
                    title: data.content,
                    time: data.time || "09:00",
                    done: false
                });
                saveTodosToLocal(currentTodos);
                renderTodoListAndReminder(currentTodos);
            }

            speak("已成功存入文件，大功告成。", function() {
                setTimeout(() => {
                    resetToInitial();
                    fetchAndRenderTodos();
                }, 3000);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial();
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });
        updateGreetingByTime();
        initSpeechRecognition();
        fetchAndRenderTodos();
    });
</script>
</body>
