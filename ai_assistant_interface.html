<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="apple-touch-icon" href="https://flaticon.com">
    <link rel="icon" href="https://flaticon.com">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { text-align: center; padding: 20px; width: 90%; max-width: 400px; }
        h1 { font-size: 24px; margin-bottom: 5px; font-weight: 600; }
        p { font-size: 14px; color: #e0e0e0; margin-bottom: 40px; }
        .mic-btn {
            width: 120px; height: 120px; border-radius: 50%; background: #ffffff; border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; outline: none;
            transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording { animation: pulse 1.5s infinite; background: #ff4757; }
        .mic-btn.confirming { animation: pulse-blue 1.5s infinite; background: #00ffcc; }
        .mic-icon { width: 50px; height: 50px; fill: #2a5298; transition: fill 0.3s; }
        .mic-btn.recording .mic-icon, .mic-btn.confirming .mic-icon { fill: #ffffff; }
        #status { font-size: 16px; margin-top: 30px; min-height: 24px; font-weight: 500; color: #00ffcc; }
        #result { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 15px; min-height: 40px; text-align: left; }
        
        .btn-group { display: none; margin-top: 20px; justify-content: space-around; width: 100%; }
        .action-btn { padding: 12px 25px; border-radius: 25px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; width: 45%; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-yes { background: #00ffcc; color: #1e3c72; }
        .btn-no { background: #ff4757; color: #ffffff; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>AI 語音智慧助手</h1>
    <p id="subTitle">點擊麥克風後開始說話...</p>
    <button class="mic-btn" id="micButton">
        <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/>
        </svg>
    </button>
    <div id="status">準備就緒</div>
    <div id="result">識別結果與解析會顯示在這裡...</div>
    
    <div class="btn-group" id="btnGroup">
        <button class="action-btn btn-yes" id="btnYes">對，沒錯</button>
        <button class="action-btn btn-no" id="btnNo">不對，取消</button>
    </div>
</div>
<script>
    // 🔗 請務必確認這裡的 Google Apps Script 網址是否為最新部署的版本
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHkvhdCOh3s834JA35-v44hMQvvcxagEjLuxiyVjeQAqfsow1Zq2c32zUl1XyBJPIMTg/exec";

    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const btnGroup = document.getElementById('btnGroup');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    
    let recognition; let isRecording = false; let isConfirmStage = false; let savedPendingData = null;

    function initSynth() {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(u);
        }
    }

    // 主動向手機申請麥克風硬體權限
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
            console.log("麥克風硬體權限已核准");
            // 釋放串流防止佔用
            stream.getTracks().forEach(track => track.stop());
        })
        .catch(function(err) {
            statusText.innerText = "❌ 麥克風被系統拒絕，請至手機設定允許瀏覽器取用麥克風。";
            statusText.style.color = "#ff4757";
        });
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition(); recognition.continuous = false; recognition.lang = 'zh-TW';

        recognition.onstart = () => { 
            isRecording = true; 
            if (isConfirmStage) {
                micButton.classList.add('confirming'); 
                statusText.innerText = "請回答「對」或「不對」，也可以直接點擊按鈕...";
            } else {
                micButton.classList.add('recording'); statusText.innerText = "正在聆聽中，請說話..."; 
            }
        };
        recognition.onend = () => { isRecording = false; micButton.classList.remove('recording'); micButton.classList.remove('confirming'); };
        recognition.onresult = (event) => { 
            const text = event.results[0][0].transcript.trim(); 
            if (isConfirmStage) { handleConfirmation(text); } else { resultText.innerText = "聽到指令：" + text; parseCommand(text); }
        };
        recognition.onerror = (event) => { 
            statusText.innerText = "❌ 語音出錯: " + event.error + "，請重開網頁再試一次"; 
            resetToInitial(); 
        };
    } else { statusText.innerText = "瀏覽器不支援語音辨識"; micButton.style.display = 'none'; }

    micButton.addEventListener('click', () => { 
        initSynth();
        if (isRecording) { recognition.stop(); } else { recognition.start(); } 
    });

    btnYes.addEventListener('click', () => { handleConfirmation("對"); });
    btnNo.addEventListener('click', () => { handleConfirmation("不對"); });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'zh-TW'; utterance.rate = 1.0;
            if (callback) { utterance.onend = callback; }
            window.speechSynthesis.speak(utterance);
        } else if (callback) { callback(); }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意...";
        let pendingData = null;
        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) {
                const amount = amountMatch[0];
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim();
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text };
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0]; let timeStr = "09:00";
            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) {
                const currentYear = new Date().getFullYear();
                dateStr = `${currentYear}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`;
            } else if (text.includes("明天")) {
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); dateStr = tomorrow.toISOString().split('T')[0];
            }
            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) {
                let hour = parseInt(timeMatch[1]); let minute = timeMatch[2] ? timeMatch[2] : "00";
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) { hour += 12; }
                timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }

        if (pendingData) {
            savedPendingData = pendingData; isConfirmStage = true; btnGroup.style.display = 'flex';
            statusText.innerText = "🔊 正在進行雙向確認...";
            speak(`確認內容，請問是要記錄：${text}，對嗎？`, () => {
                if (!isRecording && isConfirmStage) { recognition.start(); }
            });
        } else {
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。";
            speak("抱歉，我沒有聽懂，請重新說一次。");
        }
    }

    function handleConfirmation(text) {
        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好")) {
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            speak("收到，正在幫您寫入文件。"); sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❌ 已取消記錄。";
            speak("好的，已幫您取消。", () => { resetToInitial(); });
        }
    }

    function resetToInitial() {
        isConfirmStage = false; savedPendingData = null; btnGroup.style.display = 'none';
        statusText.innerText = "準備就緒"; subTitle.innerText = "點擊麥克風後開始說話...";
    }

    function sendToGas(data) {
fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
.then(() => {
statusText.innerText = "✅ 處理完成！已成功存入文件。";
resultText.innerText = [已記錄]\n類型: ${data.mode === 'expense' ? '記帳' : '提醒事項'}\n內容: ${data.content};
speak("已成功儲存。"); resetToInitial();
}).catch(err => {
statusText.innerText = "❌ 傳送失敗";
speak("傳送失敗。");
console.error(err);
resetToInitial();
});
}
