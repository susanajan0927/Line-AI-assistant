<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 95px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }
        .header-section {
            position: relative;
            padding-top: 8px;
            min-height: 95px;
        }
        .greeting-box {
            max-width: 65%;
        }
        .greeting-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .greeting-sub {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2563eb;
            font-weight: 500;
        }
        .robot-illustration {
            position: absolute;
            top: -12px;
            right: -8px;
            width: 135px;
            height: 135px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .robot-svg {
            width: 115px;
            height: 115px;
            filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.15));
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            color: #1e40af;
        }
        .card-date {
            font-size: 0.9rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            color: #1e3a8a;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.9rem;
            color: #2563eb;
            font-weight: 500;
            flex-shrink: 0;
        }
        .status-bar {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(219, 234, 254, 0.55);
            border-radius: 14px;
            font-size: 14px;
            color: #1e3a8a;
            line-height: 1.45;
            white-space: pre-line;
            word-break: break-word;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            position: relative;
        }
        .reminder-bell {
            position: absolute;
            left: -8px;
            top: 12px;
            font-size: 1.4rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.85rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }
        .reminder-time {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
        }
        .reminder-divider {
            width: 2px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 12px;
        }
        .reminder-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 12px 0 20px 0;
            gap: 12px;
            position: relative;
            z-index: 20;
        }
        .mic-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .mic-btn:active {
            transform: scale(0.93);
        }
        .mic-icon {
            width: 45px;
            height: 45px;
            fill: #ffffff;
            pointer-events: none;
        }
        .mic-btn.recording {
            animation: pulse-red 1.5s infinite;
            background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%);
        }
        .mic-btn.confirming {
            animation: pulse-teal 1.5s infinite;
            background: radial-gradient(circle, #2ed573 0%, #1ea896 100%);
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 22px rgba(255, 71, 87, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); transform: scale(1); }
        }
        @keyframes pulse-teal {
            0% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 22px rgba(30, 168, 150, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0); transform: scale(1); }
        }
        .voice-hint-text {
            font-size: 0.95rem;
            color: #2563eb;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-hint-text::before, .voice-hint-text::after {
            content: "";
            width: 15px;
            height: 2px;
            background-color: #bfdbfe;
            display: inline-block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 75px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 15;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: #2563eb; }
    </style>
</head>
<body>
<div class="phone-container">
    <header class="header-section">
        <div class="greeting-box">
            <h1 class="greeting-title" id="greetingTitle">早安！ <span>💙</span></h1>
            <p class="greeting-sub" id="subTitle">今天也要加油喔！<br>點擊麥克風後開始說話...</p>
        </div>
        <div class="robot-illustration">
            <svg class="robot-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#dbeafe"/>
                    </linearGradient>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60a5fa"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                    </linearGradient>
                    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b"/>
                        <stop offset="100%" stop-color="#0f172a"/>
                    </linearGradient>
                </defs>
                <line x1="70" y1="26" x2="70" y2="14" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
                <circle cx="70" cy="12" r="5" fill="#3b82f6"/>
                <rect x="22" y="45" width="12" height="32" rx="6" fill="url(#blueGrad)"/>
                <rect x="106" y="45" width="12" height="32" rx="6" fill="url(#blueGrad)"/>
                <rect x="30" y="26" width="80" height="66" rx="28" fill="url(#headGrad)" stroke="#93c5fd" stroke-width="3"/>
                <rect x="40" y="38" width="60" height="40" rx="18" fill="url(#screenGrad)"/>
                <path d="M 48 56 Q 53 49 58 56" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M 82 56 Q 87 49 92 56" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="46" cy="63" r="3.5" fill="#fb7185" opacity="0.8"/>
                <circle cx="94" cy="63" r="3.5" fill="#fb7185" opacity="0.8"/>
                <path d="M 64 62 Q 70 70 76 62 Z" fill="#fb7185"/>
                <path d="M 45 94 Q 70 90 95 94 L 100 116 Q 70 122 40 116 Z" fill="url(#headGrad)" stroke="#93c5fd" stroke-width="2.5"/>
                <circle cx="70" cy="105" r="9" fill="url(#blueGrad)"/>
                <path d="M 70 100 v 6 M 67 104 a 3 3 0 0 0 6 0 M 70 107 v 2" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <ellipse cx="47" cy="93" rx="9" ry="7" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
                <ellipse cx="93" cy="93" rx="9" ry="7" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
                <path d="M 118 28 C 118 25 114 25 114 28 C 114 25 110 25 110 28 C 110 31 114 34 114 34 C 114 34 118 31 118 28 Z" fill="#fda4af"/>
            </svg>
        </div>
    </header>
    
    <main class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.3rem;"></i> 今日待辦</div>
            <div class="card-date" id="current-date">載入中...</div>
        </div>
        <div class="todo-list" id="todo-container"><p style="color: var(--text-muted); font-size: 0.9rem;">正在同步最新行程...</p></div>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="result" class="result-box">識別結果與解析會顯示在這裡...</div>
    </main>
    
    <div class="reminder-card">
        <div class="reminder-bell">🔔</div>
        <div class="reminder-body">
            <div class="reminder-label">下一個提醒</div>
            <div class="reminder-content-flex">
                <div class="reminder-time" id="next-time">--:--</div>
                <div class="reminder-divider"></div>
                <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                <div class="badge-upcoming">距離最近</div>
            </div>
        </div>
    </div>
    
    <div class="voice-section">
        <button type="button" class="mic-btn" id="micButton">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
        </button>
        <div class="voice-hint-text" id="voiceHint">點擊麥克風開始</div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHkvhdCOh3s834JA35-v44hMQvvcxagEjLuxiyVjeQAqfsow1Zq2c32zUl1XyBJPIMTg/exec";
    
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    const greetingTitle = document.getElementById('greetingTitle');
    
    let recognition = null; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;

    // 防手震與防切斷緩衝變數
    let finalTranscript = "";
    let interimTranscript = "";
    let silenceTimer = null;
    const SILENCE_DELAY_MS = 2200; // 停止說話滿 2.2 秒才送出分析

    function updateGreetingByTime() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) {
            greetingTitle.innerHTML = '早安！ <span>💙</span>';
            subTitle.innerHTML = '今天也要加油喔！<br>點擊麥克風後開始說話...';
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerHTML = '午安！ <span>☀️</span>';
            subTitle.innerHTML = '下午也要保持活力喔！<br>有什麼需要幫忙的嗎？';
        } else {
            greetingTitle.innerHTML = '晚安！ <span>🌙</span>';
            subTitle.innerHTML = '辛苦一天了！<br>明天有什麼行程要記錄嗎？';
        }
    }

    updateGreetingByTime();
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

    function updateNearestReminder(todos) {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        const upcoming = todos
            .filter(t => !t.done && t.time && t.time.includes(':'))
            .map(t => {
                const parts = t.time.split(':');
                const h = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                return { ...t, totalMinutes: h * 60 + m };
            })
            .filter(t => t.totalMinutes >= currentMinutes)
            .sort((a, b) => a.totalMinutes - b.totalMinutes);

        if (upcoming.length > 0) {
            document.getElementById('next-time').innerText = upcoming[0].time;
            document.getElementById('next-task').innerText = upcoming[0].title;
        } else {
            const anyUnfinished = todos.filter(t => !t.done && t.time && t.time.includes(':'));
            if (anyUnfinished.length > 0) {
                document.getElementById('next-time').innerText = anyUnfinished[0].time;
                document.getElementById('next-task').innerText = anyUnfinished[0].title;
            } else {
                document.getElementById('next-time').innerText = "--:--";
                document.getElementById('next-task').innerText = "今日提醒已全數完成 ✨";
            }
        }
    }

    async function fetchAndRenderTodos() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && data.todos && data.todos.length > 0) {
                if (data.date) document.getElementById('current-date').innerText = data.date;
                renderTodoList(data.todos);
                updateNearestReminder(data.todos);
            } else {
                loadLocalMockData();
            }
        } catch (error) {
            loadLocalMockData();
        }
    }

    function renderTodoList(todos) {
        todoContainer.innerHTML = '';
        todos.forEach(todo => {
            todoContainer.innerHTML += `
                <div class="todo-item">
                    <div class="todo-left">
                        <div class="todo-checkbox ${todo.done ? 'checked' : ''}">
                            ${todo.done ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <span class="todo-text ${todo.done ? 'completed' : ''}">${todo.title}</span>
                    </div>
                    ${todo.time ? `<div class="todo-time">${todo.time}</div>` : ''}
                </div>
            `;
        });
    }

    function loadLocalMockData() {
        const mockTodos = [
            { title: "開會討論專案進度", time: "09:30", done: false }, 
            { title: "閱讀一本好書 💕", time: "", done: true }, 
            { title: "運動 30 分鐘", time: "18:00", done: false }, 
            { title: "準備晚餐", time: "19:30", done: false }
        ];
        renderTodoList(mockTodos);
        updateNearestReminder(mockTodos);
    }

    // 初始化語音辨識引擎
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition(); 
        recognition.lang = 'zh-TW';
        
        recognition.onstart = () => {
            isRecording = true;
            if (isConfirmStage) { 
                micButton.classList.remove('recording'); 
                micButton.classList.add('confirming'); 
                statusText.innerText = "請回答「對」或「不對」..."; 
                voiceHint.innerText = "聆聽確認語音中"; 
            } else { 
                finalTranscript = "";
                interimTranscript = "";
                micButton.classList.remove('confirming'); 
                micButton.classList.add('recording'); 
                statusText.innerText = "正在聆聽中，請安心說完..."; 
                voiceHint.innerText = "講完停頓 2 秒自動送出（或再點一次結束）"; 
            }
        };
        
        recognition.onend = () => { 
            isRecording = false; 
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording'); 
            micButton.classList.remove('confirming'); 

            // 若在第一階段且已經有累積的文字，代表是停頓時間到或使用者手動按下結束
            if (!isConfirmStage) {
                const combinedText = (finalTranscript + interimTranscript).trim();
                if (combinedText.length > 0) {
                    resultText.innerText = "聽到指令：" + combinedText;
                    parseCommand(combinedText);
                    finalTranscript = "";
                    interimTranscript = "";
                }
            }
        };
        
        recognition.onresult = (event) => {
            if (isConfirmStage) {
                // 第二階段確認：單句快速判斷
                const text = event.results[event.results.length - 1][0].transcript.trim();
                handleConfirmation(text);
            } else {
                // 第一階段指令：連續累積並即時顯示字幕，重置停頓倒數計時器
                clearTimeout(silenceTimer);
                interimTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                const liveText = (finalTranscript + interimTranscript).trim();
                resultText.innerText = "正在聆聽：" + liveText;

                // 只要還在講話就持續延後結束；一旦安靜超過 2.2 秒就自動結束錄音並解析
                silenceTimer = setTimeout(() => {
                    if (isRecording) {
                        recognition.stop();
                    }
                }, SILENCE_DELAY_MS);
            }
        };
        
        recognition.onerror = (event) => { 
            clearTimeout(silenceTimer);
            if (event.error === 'not-allowed') {
                statusText.innerText = "❌ 麥克風權限被拒絕，請至瀏覽器設定允許麥克風";
            } else if (event.error === 'no-speech') {
                statusText.innerText = "⚠️ 沒有聽到聲音，請點擊麥克風再試一次";
            } else {
                statusText.innerText = "⚠️ 語音識別出錯 (" + event.error + ")，請再試一次"; 
            }
            resetToInitial(false); 
        };
    } else { 
        statusText.innerText = "⚠️ 請改用 Safari 或 Chrome 開啟以使用語音功能"; 
        voiceHint.innerText = "目前瀏覽器不支援語音輸入";
    }

    function startListening(confirmMode) {
        if (!recognition) {
            alert("目前開啟的瀏覽器不支援語音功能，請點擊右上角或右下角選單，選擇「使用預設瀏覽器（Safari 或 Chrome）開啟」！

(提醒：請勿直接在 LINE 聊天視窗內開啟)");
            return;
        }
        // 第一階段開啟連續聆聽與即時字幕；第二階段確認維持快速單句模式
        recognition.continuous = !confirmMode;
        recognition.interimResults = !confirmMode;
        try {
            recognition.start();
        } catch (err) {
            console.warn("麥克風啟動重試:", err);
        }
    }

    micButton.addEventListener('click', function(e) {
        e.preventDefault();
        if (isRecording) { 
            clearTimeout(silenceTimer);
            recognition.stop(); 
        } else { 
            startListening(isConfirmStage);
        } 
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message); 
            utterance.lang = 'zh-TW'; 
            utterance.rate = 1.0;
            if (callback) { utterance.onend = callback; }
            window.speechSynthesis.speak(utterance);
        } else if (callback) { 
            callback(); 
        }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意..."; 
        let pendingData = null;
        
        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) { 
                const amount = amountMatch[0]; 
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim(); 
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text }; 
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0]; 
            let timeStr = "09:00";
            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) { 
                const currentYear = new Date().getFullYear(); 
                dateStr = `${currentYear}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`; 
            } else if (text.includes("明天")) { 
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); 
                dateStr = tomorrow.toISOString().split('T')[0]; 
            }
            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) { 
                let hour = parseInt(timeMatch[1], 10); 
                let minute = timeMatch[2] ? timeMatch[2] : "00"; 
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) { hour += 12; } 
                timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`; 
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }
        
        if (pendingData) {
            savedPendingData = pendingData; 
            isConfirmStage = true; 
            statusText.innerText = "🔊 正在語音確認中..."; 
            voiceHint.innerText = "請準備回答對或不對";
            const askMsg = `確認內容，請問是要記錄：${text}，對嗎？`; 
            speak(askMsg, () => { 
                if (!isRecording) { 
                    startListening(true); 
                } 
            });
        } else { 
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。"; 
            speak("抱歉，我沒有聽懂，請重新說一次。"); 
            voiceHint.innerText = "點擊麥克風重新開始"; 
        }
    }

    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            voiceHint.innerText = "點擊麥克風重新開始";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial(true);
            });
            return;
        }

        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial(true);
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            voiceHint.innerText = "同步至後端中";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording) startListening(true);
            });
        }
    }

    function resetToInitial(clearStatus = true) {
        isConfirmStage = false;
        savedPendingData = null;
        finalTranscript = "";
        interimTranscript = "";
        clearTimeout(silenceTimer);
        if (clearStatus) {
            statusText.innerText = "準備就緒";
        }
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
    }

    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]\n類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "\n內容: " + data.content;
            if (data.mode === 'reminder') { 
                document.getElementById('next-time').innerText = data.time || "--:--"; 
                document.getElementById('next-task').innerText = data.content; 
            }
            speak("已成功存入文件，大功告成。", function() {
                setTimeout(() => {
                    resetToInitial(true);
                    fetchAndRenderTodos();
                }, 3000);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial(true);
        });
    }

    window.addEventListener('DOMContentLoaded', () => { 
        fetchAndRenderTodos(); 
    });
</script>
