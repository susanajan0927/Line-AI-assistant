<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 130px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        .header-section {
            position: relative;
            padding-top: 10px;
            min-height: 110px;
        }
        .greeting-box {
            max-width: 65%;
        }
        .greeting-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 6px;
        }
        .greeting-sub {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2563eb;
            font-weight: 500;
        }
        .robot-illustration {
            position: absolute;
            top: -10px;
            right: -5px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.5) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .robot-svg {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 6px 12px rgba(59, 130, 246, 0.18));
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            color: #1e40af;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: #60a5fa;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            transition: transform 0.3s;
        }
        .refresh-btn:active {
            transform: rotate(180deg);
        }
        .card-date {
            font-size: 0.9rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            color: #1e3a8a;
            gap: 10px;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text {
            line-height: 1.4;
            word-break: break-word;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.9rem;
            color: #2563eb;
            font-weight: 500;
            white-space: nowrap;
        }
        .status-bar {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(219, 234, 254, 0.5);
            border-radius: 14px;
            font-size: 14px;
            color: #1e3a8a;
            line-height: 1.5;
            min-height: 46px;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            position: relative;
        }
        .reminder-bell {
            position: absolute;
            left: -8px;
            top: 12px;
            font-size: 1.4rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.85rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
        }
        .reminder-time {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
        }
        .reminder-divider {
            width: 2px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        .reminder-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
            line-height: 1.3;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0 25px 0;
            gap: 12px;
            position: relative;
            z-index: 20;
        }
        .mic-btn {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-icon { width: 42px; height: 42px; fill: #ffffff; transition: fill 0.3s; }
        .mic-btn.recording { animation: pulse-red 1.5s infinite; background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%); }
        .mic-btn.confirming { animation: pulse-teal 1.5s infinite; background: radial-gradient(circle, #2ed573 0%, #1ea896 100%); }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); transform: scale(1); } 70% { box-shadow: 0 0 0 22px rgba(255, 71, 87, 0); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); transform: scale(1); } }
        @keyframes pulse-teal { 0% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0.7); transform: scale(1); } 70% { box-shadow: 0 0 0 22px rgba(30, 168, 150, 0); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0); transform: scale(1); } }
        .voice-hint-text { font-size: 0.95rem; color: #2563eb; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .voice-hint-text::before, .voice-hint-text::after { content: ""; width: 15px; height: 2px; background-color: #bfdbfe; display: inline-block; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 75px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px 24px 0 0; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 500; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: #2563eb; }
    </style>
</head>
<body>
<div class="phone-container">
    <header class="header-section">
        <div class="greeting-box">
            <h1 class="greeting-title" id="greetingTitle">早安！ 💙</h1>
            <p class="greeting-sub" id="subTitle">今天也要加油喔！<br>點擊麥克風後開始說話...</p>
        </div>
        <div class="robot-illustration">
            <svg class="robot-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bodyGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#dbeafe"/>
                    </linearGradient>
                    <linearGradient id="earGrad" x1="0" y1="0" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60a5fa"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                    </linearGradient>
                </defs>
                <line x1="60" y1="12" x2="60" y2="26" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
                <circle cx="60" cy="10" r="5" fill="#3b82f6"/>
                <rect x="14" y="45" width="12" height="26" rx="6" fill="url(#earGrad)"/>
                <rect x="94" y="45" width="12" height="26" rx="6" fill="url(#earGrad)"/>
                <rect x="24" y="26" width="72" height="62" rx="28" fill="url(#bodyGrad)" stroke="#93c5fd" stroke-width="3"/>
                <rect x="34" y="38" width="52" height="36" rx="16" fill="#1e3a8a"/>
                <circle cx="48" cy="54" r="5" fill="#60a5fa"/>
                <circle cx="49.5" cy="52.5" r="1.8" fill="#ffffff"/>
                <circle cx="72" cy="54" r="5" fill="#60a5fa"/>
                <circle cx="73.5" cy="52.5" r="1.8" fill="#ffffff"/>
                <path d="M55 63 Q60 68 65 63" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <ellipse cx="42" cy="61" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>
                <ellipse cx="78" cy="61" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>
                <path d="M40 92 Q60 86 80 92 L85 108 Q60 112 35 108 Z" fill="url(#bodyGrad)" stroke="#93c5fd" stroke-width="2.5"/>
                <circle cx="60" cy="99" r="4" fill="#60a5fa"/>
            </svg>
        </div>
    </header>
    
    <main class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.3rem;"></i> 
                今日待辦
                <button class="refresh-btn" onclick="fetchAndRenderTodos()" title="重新整理"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="card-date" id="current-date">載入中...</div>
        </div>
        <div class="todo-list" id="todo-container"><p style="color: var(--text-muted); font-size: 0.9rem;">正在同步試算表行程...</p></div>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="result" class="result-box">識別結果與解析會顯示在這裡...</div>
    </main>
    
    <div class="reminder-card">
        <div class="reminder-bell">🔔</div>
        <div class="reminder-body">
            <div class="reminder-label">下一個提醒</div>
            <div class="reminder-content-flex">
                <div class="reminder-time" id="next-time">--:--</div>
                <div class="reminder-divider"></div>
                <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                <div class="badge-upcoming">距離最近</div>
            </div>
        </div>
    </div>
    
    <div class="voice-section">
        <button class="mic-btn" id="micButton" type="button">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
        </button>
        <div class="voice-hint-text" id="voiceHint">點擊麥克風開始</div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHkvhdCOh3s834JA35-v44hMQvvcxagEjLuxiyVjeQAqfsow1Zq2c32zUl1XyBJPIMTg/exec";
    
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const greetingTitle = document.getElementById('greetingTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    
    let recognition; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;
    let finalTranscriptBuffer = "";
    let silenceTimer = null;

    function updateGreetingByTime() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) {
            greetingTitle.innerText = "早安！ 💙";
            subTitle.innerHTML = "今天也要加油喔！<br>點擊麥克風後開始說話...";
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerText = "午安！ ☀️";
            subTitle.innerHTML = "下午也要保持活力喔！<br>點擊麥克風後開始說話...";
        } else {
            greetingTitle.innerText = "晚安！ 🌙";
            subTitle.innerHTML = "辛苦一天了，要記錄什麼嗎？<br>點擊麥克風後開始說話...";
        }
    }

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

    function updateNearestReminder(todos) {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        const upcoming = todos.filter(t => !t.done && t.time && t.time.includes(':')).map(t => {
            const parts = t.time.split(':');
            const mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            return { ...t, totalMinutes: mins };
        }).filter(t => t.totalMinutes >= currentMinutes)
          .sort((a, b) => a.totalMinutes - b.totalMinutes);

        if (upcoming.length > 0) {
            document.getElementById('next-time').innerText = upcoming[0].time;
            document.getElementById('next-task').innerText = upcoming[0].title;
        } else {
            const anyUnfinished = todos.filter(t => !t.done && t.time);
            if (anyUnfinished.length > 0) {
                document.getElementById('next-time').innerText = anyUnfinished[0].time;
                document.getElementById('next-task').innerText = anyUnfinished[0].title;
            } else {
                document.getElementById('next-time').innerText = "--:--";
                document.getElementById('next-task').innerText = "今日提醒已全數完成 ✨";
            }
        }
    }

    function renderTodoList(todos) {
        todoContainer.innerHTML = '';
        if (!todos || todos.length === 0) {
            todoContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.95rem; text-align: center; padding: 10px 0;">今日暫無提醒事項 🌸</p>';
            document.getElementById('next-time').innerText = "--:--";
            document.getElementById('next-task').innerText = "目前暫無即將到來的提醒";
            return;
        }
        todos.forEach(todo => {
            todoContainer.innerHTML += `
                <div class="todo-item">
                    <div class="todo-left">
                        <div class="todo-checkbox ${todo.done ? 'checked' : ''}">
                            ${todo.done ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <span class="todo-text ${todo.done ? 'completed' : ''}">${todo.title}</span>
                    </div>
                    ${todo.time ? `<div class="todo-time">${todo.time}</div>` : ''}
                </div>
            `;
        });
        updateNearestReminder(todos);
    }

    async function fetchAndRenderTodos() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && Array.isArray(data.todos)) {
                if (data.date) document.getElementById('current-date').innerText = data.date;
                renderTodoList(data.todos);
                localStorage.setItem('cached_todos_v8', JSON.stringify(data.todos));
            }
        } catch (error) {
            console.warn("讀取後端資料異常:", error);
            const cached = localStorage.getItem('cached_todos_v8');
            if (cached) {
                renderTodoList(JSON.parse(cached));
            } else {
                todoContainer.innerHTML = '<p style="color: #60a5fa; font-size: 0.9rem; text-align: center;">無法連線至試算表，請確認 GAS 部署權限設為「所有人」</p>';
            }
        }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition(); 
        recognition.lang = 'zh-TW';
        recognition.interimResults = true;
        
        recognition.onstart = () => {
            isRecording = true;
            finalTranscriptBuffer = "";
            if (silenceTimer) clearTimeout(silenceTimer);

            if (isConfirmStage) { 
                micButton.classList.remove('recording'); 
                micButton.classList.add('confirming'); 
                statusText.innerText = "請回答「對」或「不對」..."; 
                voiceHint.innerText = "聆聽確認語音中"; 
            } else { 
                micButton.classList.remove('confirming'); 
                micButton.classList.add('recording'); 
                statusText.innerText = "正在聆聽中，請說話（講完停頓 2 秒自動送出）..."; 
                voiceHint.innerText = "正在聆聽您的指令"; 
            }
        };
        
        recognition.onend = () => { 
            isRecording = false; 
            micButton.classList.remove('recording'); 
            micButton.classList.remove('confirming'); 
            if (silenceTimer) clearTimeout(silenceTimer);

            if (!isConfirmStage && finalTranscriptBuffer.trim() !== "") {
                const spokenText = finalTranscriptBuffer.trim();
                finalTranscriptBuffer = "";
                resultText.innerText = "聽到指令：" + spokenText;
                parseCommand(spokenText);
            }
        };
        
        recognition.onresult = (event) => {
            let interimTranscript = "";
            let currentFinal = "";

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcriptPiece = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    currentFinal += transcriptPiece;
                } else {
                    interimTranscript += transcriptPiece;
                }
            }

            if (currentFinal) {
                finalTranscriptBuffer += currentFinal;
            }

            const displayPreview = (finalTranscriptBuffer + interimTranscript).trim();

            if (isConfirmStage) {
                if (displayPreview) {
                    resultText.innerText = "🎙️ 聽到確認：" + displayPreview;
                }
                if (currentFinal) {
                    const confirmText = currentFinal.trim();
                    recognition.stop();
                    handleConfirmation(confirmText);
                }
            } else {
                if (displayPreview) {
                    resultText.innerText = "🎙️ 即時字幕：" + displayPreview;
                }
                if (silenceTimer) clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (isRecording) {
                        recognition.stop();
                    }
                }, 2200);
            }
        };
        
        recognition.onerror = (e) => { 
            if (e.error === 'no-speech' && finalTranscriptBuffer.trim() !== "") {
                return;
            }
            statusText.innerText = "語音識別出錯 (" + e.error + ")，請再試一次"; 
            resetToInitial(); 
        };
    } else { 
        statusText.innerText = "⚠️ 請改用 Safari 或 Chrome 開啟以使用語音功能"; 
        micButton.style.opacity = '0.5'; 
    }

    micButton.addEventListener('click', () => { 
        if (!recognition) {
            alert("此瀏覽器不支援語音辨識，請改用 Chrome 或 Safari 開啟網頁！");
            return;
        }
        if (isRecording) { 
            if (silenceTimer) clearTimeout(silenceTimer);
            recognition.stop(); 
        } else { 
            recognition.continuous = !isConfirmStage;
            try {
                recognition.start(); 
            } catch (err) {
                console.warn("語音啟動重試:", err);
            }
        } 
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message); 
            utterance.lang = 'zh-TW'; 
            utterance.rate = 1.0;
            if (callback) { utterance.onend = callback; }
            window.speechSynthesis.speak(utterance);
        } else if (callback) { callback(); }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意..."; 
        let pendingData = null;
        
        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) { 
                const amount = amountMatch[0]; 
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim(); 
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text }; 
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0]; 
            let timeStr = "09:00";
            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) { 
                const currentYear = new Date().getFullYear(); 
                dateStr = `${currentYear}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`; 
            } else if (text.includes("明天")) { 
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); 
                dateStr = tomorrow.toISOString().split('T')[0]; 
            }
            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) { 
                let hour = parseInt(timeMatch[1], 10); 
                let minute = timeMatch[2] ? timeMatch[2] : "00"; 
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) { hour += 12; } 
                timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`; 
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }
        
        if (pendingData) {
            savedPendingData = pendingData; 
            isConfirmStage = true; 
            statusText.innerText = "🔊 正在語音確認中..."; 
            voiceHint.innerText = "請準備回答對或不對";
            const askMsg = `確認內容，請問是要記錄：${text}，對嗎？`; 
            speak(askMsg, () => { 
                if (!isRecording) { 
                    recognition.continuous = false;
                    recognition.start(); 
                } 
            });
        } else { 
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。"; 
            speak("抱歉，我沒有聽懂，請重新說一次。"); 
            voiceHint.innerText = "點擊麥克風重新開始"; 
        }
    }

    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            voiceHint.innerText = "點擊麥克風重新開始";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial();
            });
            return;
        }

        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial();
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            voiceHint.innerText = "同步至後端中";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording) {
                    recognition.continuous = false;
                    recognition.start();
                }
            });
        }
    }

    function resetToInitial() {
        isConfirmStage = false;
        savedPendingData = null;
        finalTranscriptBuffer = "";
        if (silenceTimer) clearTimeout(silenceTimer);
        statusText.innerText = "準備就緒";
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
    }

    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]
類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "
內容: " + data.content;
            
            if (data.mode === 'reminder') {
                const todayStr = new Date().toISOString().split('T')[0];
                if (data.date === todayStr) {
                    const cached = localStorage.getItem('cached_todos_v8');
                    let currentList = cached ? JSON.parse(cached) : [];
                    currentList.push({ title: data.content, time: data.time || "09:00", done: false });
                    currentList.sort((a, b) => a.time.localeCompare(b.time));
                    localStorage.setItem('cached_todos_v8', JSON.stringify(currentList));
                    renderTodoList(currentList);
                }
            }

            speak("已成功存入文件，大功告成。", function() {
                setTimeout(() => {
                    resetToInitial();
                    fetchAndRenderTodos();
                }, 3000);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial();
        });
    }

    window.addEventListener('DOMContentLoaded', () => { 
        updateGreetingByTime();
        fetchAndRenderTodos(); 
    });
</script>
</body>
</html>
