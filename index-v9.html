<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 135px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }
        .header-section {
            position: relative;
            padding-top: 8px;
            min-height: 105px;
        }
        .greeting-box {
            max-width: 65%;
        }
        .greeting-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .greeting-sub {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2563eb;
            font-weight: 500;
        }
        .robot-illustration {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.55) 0%, rgba(255, 255, 255, 0) 72%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            color: #1e40af;
        }
        .refresh-btn {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #2563eb;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.3s;
        }
        .refresh-btn:active {
            transform: rotate(180deg);
        }
        .card-date {
            font-size: 0.9rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 220px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 1rem;
            color: #1e3a8a;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text {
            line-height: 1.4;
            word-break: break-word;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.88rem;
            color: #2563eb;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-bar {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(219, 234, 254, 0.55);
            border-radius: 14px;
            font-size: 14px;
            color: #1e3a8a;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            position: relative;
        }
        .reminder-bell {
            position: absolute;
            left: -6px;
            top: 12px;
            font-size: 1.4rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.85rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
        }
        .reminder-time {
            font-size: 1.7rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
            white-space: nowrap;
        }
        .reminder-divider {
            width: 2px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        .reminder-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
            line-height: 1.35;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 12px 0 20px 0;
            gap: 12px;
            position: relative;
            z-index: 20;
        }
        .mic-btn {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .mic-btn:active {
            transform: scale(0.94);
        }
        .mic-icon {
            width: 42px;
            height: 42px;
            fill: #ffffff;
        }
        .mic-btn.recording {
            animation: pulse-red 1.5s infinite;
            background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%);
        }
        .mic-btn.confirming {
            animation: pulse-teal 1.5s infinite;
            background: radial-gradient(circle, #2ed573 0%, #1ea896 100%);
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); transform: scale(1); }
        }
        @keyframes pulse-teal {
            0% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 20px rgba(30, 168, 150, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0); transform: scale(1); }
        }
        .voice-hint-text {
            font-size: 0.92rem;
            color: #2563eb;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-hint-text::before, .voice-hint-text::after {
            content: "";
            width: 15px;
            height: 2px;
            background-color: #bfdbfe;
            display: inline-block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 70px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        .nav-item i {
            font-size: 1.25rem;
        }
        .nav-item.active {
            color: #2563eb;
        }
    </style>
</head>
<body>
<div class="phone-container">
    <header class="header-section">
        <div class="greeting-box">
            <h1 class="greeting-title" id="greetingTitle">早安！ 💙</h1>
            <p class="greeting-sub" id="subTitle">今天也要加油喔！<br>點擊麥克風後開始說話...</p>
        </div>
        <div class="robot-illustration">
            <svg width="105" height="105" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="52" fill="#DBEAFE" fill-opacity="0.6"/>
                <line x1="60" y1="14" x2="60" y2="26" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
                <circle cx="60" cy="12" r="5" fill="#3B82F6"/>
                <rect x="20" y="42" width="10" height="24" rx="5" fill="#3B82F6"/>
                <rect x="90" y="42" width="10" height="24" rx="5" fill="#3B82F6"/>
                <rect x="28" y="26" width="64" height="54" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="4"/>
                <rect x="36" y="35" width="48" height="34" rx="14" fill="#1E3A8A"/>
                <path d="M44 50C44 47.5 47.5 47.5 47.5 50" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M72.5 50C72.5 47.5 76 47.5 76 50" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="43" cy="56" r="3" fill="#F472B6" fill-opacity="0.7"/>
                <circle cx="77" cy="56" r="3" fill="#F472B6" fill-opacity="0.7"/>
                <path d="M55 57C57 60 63 60 65 57" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
                <path d="M40 84C40 79 45 77 60 77C75 77 80 79 80 84V96C80 100 76 102 60 102C44 102 40 100 40 96V84Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3.5"/>
                <circle cx="60" cy="90" r="7" fill="#3B82F6"/>
                <path d="M60 86V91M57.5 89.5C57.5 91 58.6 92 60 92C61.4 92 62.5 91 62.5 89.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
    </header>
    
    <main class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.3rem;"></i>
                <span>今日待辦</span>
                <button class="refresh-btn" id="refreshBtn" title="重新同步試算表">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div class="card-date" id="current-date">載入中...</div>
        </div>
        <div class="todo-list" id="todo-container">
            <p style="color: var(--text-muted); font-size: 0.9rem;">正在同步試算表行程...</p>
        </div>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="result" class="result-box">識別結果與解析會顯示在這裡...</div>
    </main>
    
    <div class="reminder-card">
        <div class="reminder-bell">🔔</div>
        <div class="reminder-body">
            <div class="reminder-label">下一個提醒</div>
            <div class="reminder-content-flex">
                <div class="reminder-time" id="next-time">--:--</div>
                <div class="reminder-divider"></div>
                <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                <div class="badge-upcoming">距離最近</div>
            </div>
        </div>
    </div>
    
    <div class="voice-section">
        <button class="mic-btn" id="micButton" type="button">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
        </button>
        <div class="voice-hint-text" id="voiceHint">點擊麥克風開始</div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    // 請確認這裡填入您最新的 Google Apps Script 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8iRaum6wBwXv4mfjVw5wUgu9aOrDa7vQIKR5jJ87JYPntd8AucuxAod-guPJiJXW_Ig/exec";
    
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const greetingTitle = document.getElementById('greetingTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    const refreshBtn = document.getElementById('refreshBtn');
    
    let recognition = null; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;
    let silenceTimer = null;
    let finalTranscriptBuffer = "";

    function updateGreetingByTime() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) {
            greetingTitle.innerHTML = '早安！ 💙';
            subTitle.innerHTML = '今天也要加油喔！<br>點擊麥克風後開始說話...';
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerHTML = '午安！ ☀️';
            subTitle.innerHTML = '下午也要保持活力喔！<br>有什麼需要我幫忙的嗎？';
        } else {
            greetingTitle.innerHTML = '晚安！ 🌙';
            subTitle.innerHTML = '辛苦一天了！<br>明天有什麼行程要記錄嗎？';
        }
    }

    updateGreetingByTime();
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

    function updateNextReminderCard(todos) {
        if (!todos || todos.length === 0) {
            document.getElementById('next-time').innerText = "--:--";
            document.getElementById('next-task').innerText = "今日暫無提醒事項";
            return;
        }
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();

        const upcoming = todos
            .filter(t => !t.done && t.time && t.time.includes(':'))
            .map(t => {
                const parts = t.time.split(':');
                const mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                return { ...t, mins: mins };
            })
            .filter(t => t.mins >= nowMinutes)
            .sort((a, b) => a.mins - b.mins);

        if (upcoming.length > 0) {
            document.getElementById('next-time').innerText = upcoming[0].time;
            document.getElementById('next-task').innerText = upcoming[0].title;
        } else {
            const anyUndone = todos.find(t => !t.done);
            if (anyUndone) {
                document.getElementById('next-time').innerText = anyUndone.time || "待辦";
                document.getElementById('next-task').innerText = anyUndone.title;
            } else {
                document.getElementById('next-time').innerText = "完成";
                document.getElementById('next-task').innerText = "今日提醒已全數完成 ✨";
            }
        }
    }

    function renderTodoList(todos) {
        if (!todos || todos.length === 0) {
            todoContainer.innerHTML = '<p style="color: #64748b; font-size: 0.92rem; text-align: center; padding: 10px 0;">今日試算表尚無提醒紀錄</p>';
            updateNextReminderCard([]);
            return;
        }
        todoContainer.innerHTML = '';
        todos.forEach(todo => {
            const checkedClass = todo.done ? 'checked' : '';
            const checkIcon = todo.done ? '<i class="fa-solid fa-check"></i>' : '';
            const textClass = todo.done ? 'completed' : '';
            const timeHtml = todo.time ? '<div class="todo-time">' + todo.time + '</div>' : '';
            
            todoContainer.innerHTML += 
                '<div class="todo-item">' +
                    '<div class="todo-left">' +
                        '<div class="todo-checkbox ' + checkedClass + '">' + checkIcon + '</div>' +
                        '<span class="todo-text ' + textClass + '">' + todo.title + '</span>' +
                    '</div>' +
                    timeHtml +
                '</div>';
        });
        updateNextReminderCard(todos);
    }

    async function fetchAndRenderTodos() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && Array.isArray(data.todos)) {
                if (data.date) {
                    document.getElementById('current-date').innerText = data.date;
                }
                localStorage.setItem('ai_assistant_todos_v9', JSON.stringify(data.todos));
                renderTodoList(data.todos);
            } else {
                loadCachedTodos();
            }
        } catch (error) {
            loadCachedTodos();
        }
    }

    function loadCachedTodos() {
        const cached = localStorage.getItem('ai_assistant_todos_v9');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                renderTodoList(parsed);
                return;
            } catch (e) {}
        }
        todoContainer.innerHTML = '<p style="color: #64748b; font-size: 0.9rem; text-align: center;">尚未同步到試算表資料，請點擊右上方重新整理</p>';
    }

    refreshBtn.addEventListener('click', () => {
        todoContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">正在重新同步試算表...</p>';
        fetchAndRenderTodos();
    });

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "⚠️ 請使用 Chrome 或 Safari 開啟以支援語音";
            voiceHint.innerText = "不支援目前瀏覽器";
            return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';

        recognition.onstart = () => {
            isRecording = true;
            finalTranscriptBuffer = "";
            if (isConfirmStage) {
                micButton.classList.remove('recording');
                micButton.classList.add('confirming');
                statusText.innerText = "請回答「對」或「不對」...";
                voiceHint.innerText = "聆聽確認語音中";
            } else {
                micButton.classList.remove('confirming');
                micButton.classList.add('recording');
                statusText.innerText = "正在聆聽中，請說話（停頓 2.2 秒自動完成）...";
                voiceHint.innerText = "聆聽中（再點一次可提前結束）";
            }
        };

        recognition.onresult = (event) => {
            let interimTranscript = "";
            let currentFinal = "";

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentFinal += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (currentFinal) {
                finalTranscriptBuffer += currentFinal;
            }

            const displaySpeech = (finalTranscriptBuffer + interimTranscript).trim();

            if (isConfirmStage) {
                if (displaySpeech) {
                    recognition.stop();
                    handleConfirmation(displaySpeech);
                }
            } else {
                if (displaySpeech) {
                    resultText.innerText = "🎙️ 即時字幕：" + displaySpeech;
                }
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (isRecording) {
                        recognition.stop();
                    }
                }, 2200);
            }
        };

        recognition.onend = () => {
            isRecording = false;
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording');
            micButton.classList.remove('confirming');

            if (!isConfirmStage) {
                const spokenText = finalTranscriptBuffer.trim() || resultText.innerText.replace("🎙️ 即時字幕：", "").trim();
                if (spokenText && spokenText !== "識別結果與解析會顯示在這裡...") {
                    resultText.innerText = "聽到指令：" + spokenText;
                    parseCommand(spokenText);
                } else {
                    statusText.innerText = "未偵測到語音，請再試一次";
                    voiceHint.innerText = "點擊麥克風開始";
                }
            }
        };

        recognition.onerror = (event) => {
            isRecording = false;
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording');
            micButton.classList.remove('confirming');
            if (event.error === 'not-allowed') {
                statusText.innerText = "❌ 麥克風權限被拒絕，請在瀏覽器設定中允許";
            } else {
                statusText.innerText = "語音識別結束或超時，請再試一次";
            }
            voiceHint.innerText = "點擊麥克風開始";
        };
    }

    initSpeechRecognition();

    micButton.addEventListener('click', () => {
        if (!recognition) {
            alert("請改用手機的 Safari 或 Chrome 瀏覽器開啟此網頁，才能使用語音功能喔！");
            return;
        }
        if (isRecording) {
            clearTimeout(silenceTimer);
            recognition.stop();
        } else {
            recognition.continuous = !isConfirmStage;
            recognition.interimResults = !isConfirmStage;
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        }
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            if (callback) {
                utterance.onend = callback;
            }
            window.speechSynthesis.speak(utterance);
        } else if (callback) {
            callback();
        }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意...";
        let pendingData = null;

        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) {
                const amount = amountMatch[0];
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim();
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text };
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0];
            let timeStr = "09:00";

            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) {
                const currentYear = new Date().getFullYear();
                dateStr = currentYear + "-" + dateMatch[1].padStart(2, '0') + "-" + dateMatch[2].padStart(2, '0');
            } else if (text.includes("明天")) {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                dateStr = tomorrow.toISOString().split('T')[0];
            }

            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) {
                let hour = parseInt(timeMatch[1], 10);
                let minute = timeMatch[2] ? timeMatch[2] : "00";
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) {
                    hour += 12;
                }
                timeStr = hour.toString().padStart(2, '0') + ":" + minute.toString().padStart(2, '0');
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }

        if (pendingData) {
            savedPendingData = pendingData;
            isConfirmStage = true;
            statusText.innerText = "🔊 正在語音確認中...";
            voiceHint.innerText = "請準備回答對或不對";

            const askMsg = "確認內容，請問是要記錄：" + text + "，對嗎？";
            speak(askMsg, () => {
                if (!isRecording && recognition) {
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    try { recognition.start(); } catch(e) {}
                }
            });
        } else {
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。";
            speak("抱歉，我沒有聽懂，請重新說一次。");
            voiceHint.innerText = "點擊麥克風重新開始";
        }
    }

    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial();
            });
            return;
        }

        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial();
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording && recognition) {
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    try { recognition.start(); } catch(e) {}
                }
            });
        }
    }

    function resetToInitial() {
        isConfirmStage = false;
        savedPendingData = null;
        finalTranscriptBuffer = "";
        statusText.innerText = "準備就緒";
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
    }

    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]\n類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "\n內容: " + data.content;
            
            if (data.mode === 'reminder') {
                const cached = localStorage.getItem('ai_assistant_todos_v9');
                let currentTodos = cached ? JSON.parse(cached) : [];
                currentTodos.push({ title: data.content, time: data.time, done: false });
                localStorage.setItem('ai_assistant_todos_v9', JSON.stringify(currentTodos));
                renderTodoList(currentTodos);
            }

            speak("已成功存入文件，大功告成。", function() {
                setTimeout(() => {
                    resetToInitial();
                    fetchAndRenderTodos();
                }, 2500);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial();
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchAndRenderTodos();
    });
</script>
</body>
