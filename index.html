<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 110px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }
        .page-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-section {
            position: relative;
            padding-top: 6px;
            min-height: 98px;
        }
        .greeting-box {
            max-width: 65%;
        }
        .greeting-title {
            font-size: 1.95rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .greeting-sub {
            font-size: 0.92rem;
            line-height: 1.45;
            color: #2563eb;
            font-weight: 500;
        }
        /* 動態揮手機器人動畫 */
        .robot-illustration {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.55) 0%, rgba(255, 255, 255, 0) 72%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .robot-float {
            animation: robot-bob 3s ease-in-out infinite;
            transform-origin: center center;
        }
        .robot-waving-arm {
            transform-origin: 36px 84px;
            animation: robot-wave 2.0s ease-in-out infinite;
        }
        @keyframes robot-bob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        @keyframes robot-wave {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-32deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-28deg); }
            80% { transform: rotate(5deg); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.12rem;
            color: #1e40af;
        }
        .refresh-btn {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #2563eb;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.82rem;
            transition: transform 0.3s;
        }
        .refresh-btn:active {
            transform: rotate(180deg);
        }
        .card-date {
            font-size: 0.88rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
            max-height: 200px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.98rem;
            color: #1e3a8a;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .todo-checkbox {
            width: 21px;
            height: 21px;
            min-width: 21px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text {
            line-height: 1.38;
            word-break: break-word;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.86rem;
            color: #2563eb;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-bar {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #bfdbfe;
            font-size: 13.5px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(219, 234, 254, 0.55);
            border-radius: 14px;
            font-size: 13.5px;
            color: #1e3a8a;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 14px 18px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            position: relative;
        }
        .reminder-bell {
            position: absolute;
            left: -6px;
            top: 10px;
            font-size: 1.35rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.82rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 3px;
            gap: 8px;
        }
        .reminder-time {
            font-size: 1.65rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
            white-space: nowrap;
        }
        .reminder-divider {
            width: 2px;
            height: 22px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        .reminder-text {
            font-size: 0.92rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
            line-height: 1.35;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.74rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 12px 0 18px 0;
            gap: 16px;
            position: relative;
            z-index: 20;
        }
        .mic-wrapper {
            position: relative;
            width: 136px;
            height: 136px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 強化版明顯發散波紋（三層光環） */
        .mic-ripple {
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 30%, rgba(96, 165, 250, 0.55) 100%);
            border: 2px solid rgba(59, 130, 246, 0.65);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
            pointer-events: none;
            animation: idle-wave 2.7s infinite cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .mic-ripple.delay-1 {
            animation-delay: 0.9s;
        }
        .mic-ripple.delay-2 {
            animation-delay: 1.8s;
        }
        .mic-wrapper.recording .mic-ripple {
            background: radial-gradient(circle, rgba(255, 71, 87, 0.38) 30%, rgba(255, 107, 129, 0.65) 100%);
            border: 2.5px solid rgba(255, 71, 87, 0.85);
            box-shadow: 0 0 18px rgba(255, 71, 87, 0.45);
            animation: active-wave 1.5s infinite cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .mic-wrapper.recording .mic-ripple.delay-1 {
            animation-delay: 0.5s;
        }
        .mic-wrapper.recording .mic-ripple.delay-2 {
            animation-delay: 1.0s;
        }
        .mic-wrapper.confirming .mic-ripple {
            background: radial-gradient(circle, rgba(30, 168, 150, 0.38) 30%, rgba(46, 213, 115, 0.65) 100%);
            border: 2.5px solid rgba(30, 168, 150, 0.85);
            box-shadow: 0 0 18px rgba(30, 168, 150, 0.45);
            animation: active-wave 1.5s infinite cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .mic-wrapper.confirming .mic-ripple.delay-1 {
            animation-delay: 0.5s;
        }
        .mic-wrapper.confirming .mic-ripple.delay-2 {
            animation-delay: 1.0s;
        }
        @keyframes idle-wave {
            0% { transform: scale(1); opacity: 0.95; }
            65% { transform: scale(1.52); opacity: 0.42; }
            100% { transform: scale(1.38); opacity: 0; }
        }
        @keyframes active-wave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.48); opacity: 0; }
        }
        .mic-btn {
            position: relative;
            z-index: 2;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.38);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .mic-btn:active {
            transform: scale(0.94);
        }
        .mic-icon {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .mic-btn.recording {
            background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%);
            box-shadow: 0 8px 26px rgba(255, 71, 87, 0.5);
        }
        .mic-btn.confirming {
            background: radial-gradient(circle, #2ed573 0%, #1ea896 100%);
            box-shadow: 0 8px 26px rgba(30, 168, 150, 0.5);
        }
        .voice-hint-text {
            font-size: 0.9rem;
            color: #2563eb;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-hint-text::before, .voice-hint-text::after {
            content: "";
            width: 15px;
            height: 2px;
            background-color: #93c5fd;
            display: inline-block;
        }
        /* 統計分頁專屬樣式 */
        .stats-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(239,246,255,0.9) 100%);
            border-radius: 20px;
            padding: 16px 14px;
            box-shadow: 0 6px 18px rgba(147, 197, 253, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-label {
            font-size: 0.82rem;
            color: #64748b;
            font-weight: 600;
        }
        .stat-value {
            font-size: 1.45rem;
            font-weight: 800;
            color: #1d4ed8;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 260px;
            margin: 10px auto;
        }
        .category-breakdown {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px dashed #bfdbfe;
            padding-top: 12px;
        }
        .cat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            color: #1e3a8a;
        }
        .cat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 68px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            transition: color 0.2s;
        }
        .nav-item i {
            font-size: 1.22rem;
        }
        .nav-item.active {
            color: #2563eb;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="phone-container">
    <!-- 分頁 1：首頁 -->
    <div id="page-home" class="page-section">
        <header class="header-section">
            <div class="greeting-box">
                <h1 class="greeting-title" id="greetingTitle">早安！🌞</h1>
                <p class="greeting-sub" id="subTitle">今天也要保持好心情💖喔！<br>請點擊麥克風後開始說話...</p>
            </div>
            <div class="robot-illustration">
                <svg width="110" height="110" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="60" r="52" fill="#DBEAFE" fill-opacity="0.6"/>
                    <g class="robot-float">
                        <g class="robot-waving-arm">
                            <path d="M38 84C26 78 18 68 18 57" stroke="#60A5FA" stroke-width="6.5" stroke-linecap="round"/>
                            <circle cx="18" cy="54" r="6.5" fill="#3B82F6"/>
                            <circle cx="16.5" cy="52" r="2" fill="#FFFFFF" fill-opacity="0.85"/>
                        </g>
                        <path d="M82 84C90 87 95 92 96 98" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
                        <circle cx="96" cy="99" r="5.5" fill="#3B82F6"/>

                        <line x1="60" y1="14" x2="60" y2="26" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="60" cy="12" r="5" fill="#3B82F6"/>
                        <rect x="20" y="42" width="10" height="24" rx="5" fill="#3B82F6"/>
                        <rect x="90" y="42" width="10" height="24" rx="5" fill="#3B82F6"/>
                        <rect x="28" y="26" width="64" height="54" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="4"/>
                        <rect x="36" y="35" width="48" height="34" rx="14" fill="#1E3A8A"/>
                        <path d="M44 50C44 47.5 47.5 47.5 47.5 50" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
                        <path d="M72.5 50C72.5 47.5 76 47.5 76 50" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
                        <circle cx="43" cy="56" r="3" fill="#F472B6" fill-opacity="0.8"/>
                        <circle cx="77" cy="56" r="3" fill="#F472B6" fill-opacity="0.8"/>
                        <path d="M55 57C57 60 63 60 65 57" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
                        <path d="M40 84C40 79 45 77 60 77C75 77 80 79 80 84V96C80 100 76 102 60 102C44 102 40 100 40 96V84Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3.5"/>
                        <circle cx="60" cy="90" r="7" fill="#3B82F6"/>
                        <path d="M60 86V91M57.5 89.5C57.5 91 58.6 92 60 92C61.4 92 62.5 91 62.5 89.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
        </header>
        
        <main class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.25rem;"></i>
                    <span>今日待辦</span>
                    <button class="refresh-btn" id="refreshBtn" title="重新同步試算表">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                <div class="card-date" id="current-date">載入中...</div>
            </div>
            <div class="todo-list" id="todo-container">
                <p style="color: var(--text-muted); font-size: 0.9rem;">正在同步試算表行程...</p>
            </div>
            <div id="status" class="status-bar">準備就緒</div>
            <div id="result" class="result-box">識別結果與解析顯示在這裡...</div>
        </main>
        
        <div class="reminder-card">
            <div class="reminder-bell">🔔</div>
            <div class="reminder-body">
                <div class="reminder-label">下一個提醒</div>
                <div class="reminder-content-flex">
                    <div class="reminder-time" id="next-time">--:--</div>
                    <div class="reminder-divider"></div>
                    <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                    <div class="badge-upcoming">距離最近</div>
                </div>
            </div>
        </div>
        
        <div class="voice-section">
            <div class="mic-wrapper" id="micWrapper">
                <div class="mic-ripple"></div>
                <div class="mic-ripple delay-1"></div>
                <div class="mic-ripple delay-2"></div>
                <button class="mic-btn" id="micButton" type="button">
                    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
                </button>
            </div>
            <div class="voice-hint-text" id="voiceHint">請點擊麥克風開始</div>
        </div>
    </div>

    <!-- 分頁 2：待辦總覽 -->
    <div id="page-todo" class="page-section" style="display: none;">
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-regular fa-square-check" style="color: #3b82f6; font-size: 1.25rem;"></i>
                    <span>今日行程總覽</span>
                </div>
                <button class="refresh-btn" onclick="fetchAndRenderTodos()" title="重新整理">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div class="todo-list" id="todo-full-container" style="max-height: 420px;">
                <p style="color: #64748b; font-size: 0.92rem; text-align: center;">正在載入待辦清單...</p>
            </div>
        </div>
    </div>

    <!-- 分頁 3：記帳統計 -->
    <div id="page-stats" class="page-section" style="display: none;">
        <div class="stats-summary-grid">
            <div class="stat-box">
                <span class="stat-label"><i class="fa-regular fa-calendar"></i> 本月累計總支出</span>
                <span class="stat-value" id="month-total">$0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label"><i class="fa-solid fa-coins"></i> 年度累計總支出</span>
                <span class="stat-value" id="year-total">$0</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-chart-pie" style="color: #3b82f6; font-size: 1.2rem;"></i>
                    <span>本月生活花費佔比</span>
                </div>
                <button class="refresh-btn" onclick="loadStatsData()" title="重新計算">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div id="stats-status" style="text-align: center; font-size: 0.88rem; color: #64748b; margin-bottom: 6px;">
                點擊下方或自動同步試算表數據
            </div>
            <div class="chart-wrapper">
                <canvas id="expenseChart"></canvas>
            </div>
            <div class="category-breakdown" id="category-list"></div>
        </div>
    </div>

    <!-- 分頁 4：系統設定 -->
    <div id="page-settings" class="page-section" style="display: none;">
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-gear" style="color: #3b82f6; font-size: 1.2rem;"></i>
                    <span>助理系統設定</span>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 14px; font-size: 0.92rem; color: #334155;">
                <div style="background: #eff6ff; padding: 12px; border-radius: 14px; line-height: 1.5;">
                    <strong>📌 語音小提示：</strong><br>
                    • 記帳範例：「午餐便當花了120元」、「買咖啡85塊」<br>
                    • 提醒範例：「明天下午3點提醒我開會」、「今晚8點吃藥」
                </div>
                <button class="action-btn" onclick="forceSyncAll()">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 立即同步雲端試算表資料
                </button>
            </div>
        </div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item" onclick="switchTab('todo', this)"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item" onclick="switchTab('stats', this)"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNQZ4tvrm6RAWeMORe736N0wO4-ysQVn7vqACwEAWISX7t1wBXCPCmdt33-Gd-bGq7aw/exec";
    
    const micWrapper = document.getElementById('micWrapper');
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const subTitle = document.getElementById('subTitle');
    const greetingTitle = document.getElementById('greetingTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    const todoFullContainer = document.getElementById('todo-full-container');
    const refreshBtn = document.getElementById('refreshBtn');
    
    let recognition = null; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;
    let silenceTimer = null;
    let finalTranscriptBuffer = "";
    let expenseChartInstance = null;

    // ==================== 底部選單秒切分頁邏輯 ====================
    function switchTab(tabName, navElement) {
        document.querySelectorAll('.page-section').forEach(sec => {
            sec.style.display = 'none';
        });
        const targetPage = document.getElementById('page-' + tabName);
        if (targetPage) {
            targetPage.style.display = 'flex';
        }
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
        });
        if (navElement) {
            navElement.classList.add('active');
        }
        if (tabName === 'stats') {
            loadStatsData();
        }
        if (tabName === 'todo') {
            fetchAndRenderTodos();
        }
    }

    function forceSyncAll() {
        fetchAndRenderTodos();
        loadStatsData();
        alert("✅ 已向雲端試算表發送同步請求！");
    }

    // ==================== 統計數據讀取與圓餅圖繪製 ====================
    async function loadStatsData() {
        const statsStatus = document.getElementById('stats-status');
        const categoryListEl = document.getElementById('category-list');
        statsStatus.innerText = "⏳ 正在讀取試算表並自動分類...";

        try {
            const response = await fetch(`${GAS_WEB_APP_URL}?action=getStats`);
            const result = await response.json();

            if (result.status === 'success' && result.data) {
                const { monthTotal, yearTotal, categories } = result.data;

                document.getElementById('month-total').innerText = `$${Number(monthTotal).toLocaleString()}`;
                document.getElementById('year-total').innerText = `$${Number(yearTotal).toLocaleString()}`;

                const colorPalette = {
                    '餐飲': '#3b82f6',
                    '交通': '#10b981',
                    '購物': '#f59e0b',
                    '娛樂': '#ec4899',
                    '醫療': '#8b5cf6',
                    '其他': '#94a3b8'
                };

                const labels = [];
                const values = [];
                const bgColors = [];
                categoryListEl.innerHTML = '';

                for (const [cat, val] of Object.entries(categories)) {
                    if (val > 0) {
                        labels.push(cat);
                        values.push(val);
                        bgColors.push(colorPalette[cat] || '#60a5fa');

                        const percent = monthTotal > 0 ? Math.round((val / monthTotal) * 100) : 0;
                        categoryListEl.innerHTML += `
                            <div class="cat-row">
                                <div><span class="cat-dot" style="background:${colorPalette[cat] || '#60a5fa'}"></span>${cat}</div>
                                <div><strong>$${Number(val).toLocaleString()}</strong> <span style="color:#64748b; font-size:0.82rem;">(${percent}%)</span></div>
                            </div>
                        `;
                    }
                }

                if (values.length === 0) {
                    statsStatus.innerText = "本月尚無記帳紀錄，快去首頁用語音記一筆吧！";
                    if (expenseChartInstance) {
                        expenseChartInstance.destroy();
                        expenseChartInstance = null;
                    }
                    return;
                }

                statsStatus.innerText = "自動分類統計完成 ✨";

                const ctx = document.getElementById('expenseChart').getContext('2d');
                if (expenseChartInstance) {
                    expenseChartInstance.destroy();
                }

                expenseChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: bgColors,
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        cutout: '62%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 14,
                                    font: { size: 13 }
                                }
                            }
                        }
                    }
                });
            } else {
                statsStatus.innerText = "⚠️ 無法取得統計數據，請確認 Apps Script 已部署新版本";
            }
        } catch (err) {
            console.error("統計載入錯誤:", err);
            statsStatus.innerText = "❌ 連線失敗，請稍後再試";
        }
    }

    // ==================== 台灣時間問候語 ====================
    function updateGreetingByTime() {
        const taiwanTime = new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" });
        const hour = new Date(taiwanTime).getHours();

        if (hour >= 5 && hour < 12) {
            greetingTitle.innerHTML = '早安！🌞💖';
            subTitle.innerHTML = '今天也要保持好心情喔！<br>請點擊麥克風後開始說話...';
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerHTML = '午安！ ☀️';
            subTitle.innerHTML = '下午也要保持活力喔！<br>有什麼需要我幫忙的嗎？';
        } else if (hour >= 18 && hour < 24) {
            greetingTitle.innerHTML = '晚安！ 🌙';
            subTitle.innerHTML = '辛苦一天了！<br>明天有什麼行程要記錄嗎？';
        } else {
            greetingTitle.innerHTML = '夜深了！ ✨';
            subTitle.innerHTML = '還沒睡嗎？記得早點休息喔！<br>有什麼想法想先記下來嗎？';
        }
    }

    updateGreetingByTime();
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

    function updateNextReminderCard(todos) {
        if (!todos || todos.length === 0) {
            document.getElementById('next-time').innerText = "--:--";
            document.getElementById('next-task').innerText = "今日暫無提醒事項";
            return;
        }
        const undoneList = todos
            .filter(t => !t.done)
            .map(t => {
                let mins = 9999;
                if (t.time && t.time.includes(':')) {
                    const parts = t.time.split(':');
                    mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                }
                return { ...t, mins: mins };
            })
            .sort((a, b) => a.mins - b.mins);

        if (undoneList.length > 0) {
            document.getElementById('next-time').innerText = undoneList[0].time || "待辦";
            document.getElementById('next-task').innerText = undoneList[0].title;
        } else {
            document.getElementById('next-time').innerText = "完成";
            document.getElementById('next-task').innerText = "今日提醒已全數完成 ✨";
        }
    }

    function renderTodoList(todos) {
        if (!todos || todos.length === 0) {
            const emptyHtml = '<p style="color: #64748b; font-size: 0.92rem; text-align: center; padding: 10px 0;">今日試算表尚無提醒紀錄</p>';
            todoContainer.innerHTML = emptyHtml;
            if (todoFullContainer) todoFullContainer.innerHTML = emptyHtml;
            updateNextReminderCard([]);
            return;
        }
        let listHtml = '';
        todos.forEach(todo => {
            const checkedClass = todo.done ? 'checked' : '';
            const checkIcon = todo.done ? '<i class="fa-solid fa-check"></i>' : '';
            const textClass = todo.done ? 'completed' : '';
            const timeHtml = todo.time ? '<div class="todo-time">' + todo.time + '</div>' : '';
            
            listHtml += 
                '<div class="todo-item">' +
                    '<div class="todo-left">' +
                        '<div class="todo-checkbox ' + checkedClass + '">' + checkIcon + '</div>' +
                        '<span class="todo-text ' + textClass + '">' + todo.title + '</span>' +
                    '</div>' +
                    timeHtml +
                '</div>';
        });
        todoContainer.innerHTML = listHtml;
        if (todoFullContainer) todoFullContainer.innerHTML = listHtml;
        updateNextReminderCard(todos);
    }

    async function fetchAndRenderTodos() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && Array.isArray(data.todos)) {
                if (data.date) {
                    document.getElementById('current-date').innerText = data.date;
                }
                localStorage.setItem('ai_assistant_todos_v11', JSON.stringify(data.todos));
                renderTodoList(data.todos);
            } else {
                loadCachedTodos();
            }
        } catch (error) {
            loadCachedTodos();
        }
    }

    function loadCachedTodos() {
        const cached = localStorage.getItem('ai_assistant_todos_v11');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                renderTodoList(parsed);
                return;
            } catch (e) {}
        }
        const noDataHtml = '<p style="color: #64748b; font-size: 0.9rem; text-align: center;">尚未同步到試算表資料，請點擊右上方重新整理</p>';
        todoContainer.innerHTML = noDataHtml;
        if (todoFullContainer) todoFullContainer.innerHTML = noDataHtml;
    }

    refreshBtn.addEventListener('click', () => {
        todoContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">正在重新同步試算表...</p>';
        fetchAndRenderTodos();
    });

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "⚠️ 請使用 Chrome 或 Safari 開啟以支援語音";
            voiceHint.innerText = "不支援目前瀏覽器";
            return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';

        recognition.onstart = () => {
            isRecording = true;
            finalTranscriptBuffer = "";
            if (isConfirmStage) {
                micButton.classList.remove('recording');
                micButton.classList.add('confirming');
                micWrapper.classList.remove('recording');
                micWrapper.classList.add('confirming');
                statusText.innerText = "請回答「對」或「不對」...";
                voiceHint.innerText = "聆聽確認語音中";
            } else {
                micButton.classList.remove('confirming');
                micButton.classList.add('recording');
                micWrapper.classList.remove('confirming');
                micWrapper.classList.add('recording');
                statusText.innerText = "正在聆聽中，請說話（停頓 2.2 秒自動完成）...";
                voiceHint.innerText = "聆聽中（再點一次可提前結束）";
            }
        };

        recognition.onresult = (event) => {
            let interimTranscript = "";
            let currentFinal = "";

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentFinal += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (currentFinal) {
                finalTranscriptBuffer += currentFinal;
            }

            const displaySpeech = (finalTranscriptBuffer + interimTranscript).trim();

            if (isConfirmStage) {
                if (displaySpeech) {
                    recognition.stop();
                    handleConfirmation(displaySpeech);
                }
            } else {
                if (displaySpeech) {
                    resultText.innerText = "🎙️ 即時字幕：" + displaySpeech;
                }
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (isRecording) {
                        recognition.stop();
                    }
                }, 2200);
            }
        };

        recognition.onend = () => {
            isRecording = false;
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording');
            micButton.classList.remove('confirming');
            micWrapper.classList.remove('recording');
            micWrapper.classList.remove('confirming');

            if (!isConfirmStage) {
                const spokenText = finalTranscriptBuffer.trim() || resultText.innerText.replace("🎙️ 即時字幕：", "").trim();
                if (spokenText && spokenText !== "識別結果與解析顯示在這裡...") {
                    resultText.innerText = "聽到指令：" + spokenText;
                    parseCommand(spokenText);
                } else {
                    statusText.innerText = "未偵測到語音，請再試一次";
                    voiceHint.innerText = "點擊麥克風開始";
                }
            }
        };

        recognition.onerror = (event) => {
            isRecording = false;
            clearTimeout(silenceTimer);
            micButton.classList.remove('recording');
            micButton.classList.remove('confirming');
            micWrapper.classList.remove('recording');
            micWrapper.classList.remove('confirming');
            if (event.error === 'not-allowed') {
                statusText.innerText = "❌ 麥克風權限被拒絕，請在瀏覽器設定中允許";
            } else {
                statusText.innerText = "語音識別結束或超時，請再試一次";
            }
            voiceHint.innerText = "點擊麥克風開始";
        };
    }

    initSpeechRecognition();

    micButton.addEventListener('click', () => {
        if (!recognition) {
            alert("請改用手機的 Safari 或 Chrome 瀏覽器開啟此網頁，才能使用語音功能喔！");
            return;
        }
        if (isRecording) {
            clearTimeout(silenceTimer);
            recognition.stop();
        } else {
            recognition.continuous = !isConfirmStage;
            recognition.interimResults = !isConfirmStage;
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        }
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            if (callback) {
                utterance.onend = callback;
            }
            window.speechSynthesis.speak(utterance);
        } else if (callback) {
            callback();
        }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意...";
        let pendingData = null;

        const hasExpenseKeyword = /花|買|元|塊|付|費|錢/.test(text);
        const amountMatch = text.match(/\d+/);
        const dateMatch = text.match(/(\d+)月(\d+)[號日]?/);
        const timeMatch = text.match(/(\d+)[點時](\d+|半)?/);
        const hasRelativeTime = /今天|今日|明天|明日|後天|早上|上午|中午|下午|晚上|晚間|半夜|凌晨|待會|等一下|稍後/.test(text);
        const hasReminderKeyword = /提醒|叫我|通知|記得|別忘|不要忘|行程|預約|開會|看診|領藥|吃藥/.test(text);

        if (hasExpenseKeyword && amountMatch && !timeMatch) {
            const amount = amountMatch[0];
            const content = text.replace(amount, "").replace(/元|塊|今日|今天|花了|買了|花|買/g, "").trim();
            pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text };
        }
        else if (hasReminderKeyword || dateMatch || timeMatch || hasRelativeTime) {
            let now = new Date();
            let dateStr = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');
            let timeStr = "09:00";

            if (dateMatch) {
                const currentYear = now.getFullYear();
                dateStr = currentYear + "-" + dateMatch[1].padStart(2, '0') + "-" + dateMatch[2].padStart(2, '0');
            } else if (/明天|明日/.test(text)) {
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                dateStr = tomorrow.getFullYear() + "-" + String(tomorrow.getMonth() + 1).padStart(2, '0') + "-" + String(tomorrow.getDate()).padStart(2, '0');
            } else if (/後天/.test(text)) {
                const dayAfter = new Date(now);
                dayAfter.setDate(dayAfter.getDate() + 2);
                dateStr = dayAfter.getFullYear() + "-" + String(dayAfter.getMonth() + 1).padStart(2, '0') + "-" + String(dayAfter.getDate()).padStart(2, '0');
            }

            if (timeMatch) {
                let hour = parseInt(timeMatch[1], 10);
                let minute = "00";
                if (timeMatch[2]) {
                    minute = (timeMatch[2] === "半") ? "30" : timeMatch[2].padStart(2, '0');
                }
                if ((/下午|晚上|晚間|pm|PM/.test(text)) && hour < 12) {
                    hour += 12;
                } else if (/中午/.test(text) && hour < 11) {
                    hour += 12;
                }
                timeStr = hour.toString().padStart(2, '0') + ":" + minute;
            }

            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }

        if (pendingData) {
            savedPendingData = pendingData;
            isConfirmStage = true;
            statusText.innerText = "🔊 正在語音確認中...";
            voiceHint.innerText = "請準備回答對或不對";

            const typeLabel = pendingData.mode === 'expense' ? '記帳' : '提醒';
            const askMsg = "確認" + typeLabel + "內容，請問是要記錄：" + text + "，對嗎？";
            speak(askMsg, () => {
                if (!isRecording && recognition) {
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    try { recognition.start(); } catch(e) {}
                }
            });
        } else {
            statusText.innerText = "❌ 無法辨識指令，請說出時間或金額再試一次。";
            speak("抱歉，我沒有聽懂，請加上時間或金額再說一次。");
            voiceHint.innerText = "點擊麥克風重新開始";
        }
    }

    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial();
            });
            return;
        }

        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial();
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording && recognition) {
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    try { recognition.start(); } catch(e) {}
                }
            });
        }
    }

    function resetToInitial() {
        isConfirmStage = false;
        savedPendingData = null;
        finalTranscriptBuffer = "";
        statusText.innerText = "準備就緒";
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
        micWrapper.classList.remove('recording');
        micWrapper.classList.remove('confirming');
    }

    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]\n類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "\n內容: " + data.content;
            
            if (data.mode === 'reminder') {
                const cached = localStorage.getItem('ai_assistant_todos_v11');
                let currentTodos = cached ? JSON.parse(cached) : [];
                currentTodos.push({ title: data.content, time: data.time, done: false });
                localStorage.setItem('ai_assistant_todos_v11', JSON.stringify(currentTodos));
                renderTodoList(currentTodos);
            }

            speak("已成功存入文件，祝福平安順心。", function() {
                setTimeout(() => {
                    resetToInitial();
                    fetchAndRenderTodos();
                }, 2500);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial();
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchAndRenderTodos();
    });
</script>
</body>
