<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音智慧助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-top: #e0f2fe;
            --bg-mid: #f0fdf4;
            --bg-bottom: #bae6fd;
            --text-dark: #1e3a8a;
            --text-muted: #60a5fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding-bottom: 90px;
            overflow-x: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        .header-section {
            position: relative;
            padding-top: 10px;
            min-height: 115px;
        }
        .greeting-box {
            max-width: 62%;
        }
        .greeting-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 6px;
        }
        .greeting-sub {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2563eb;
            font-weight: 500;
        }
        .robot-illustration {
            position: absolute;
            top: -12px;
            right: -8px;
            width: 145px;
            height: 145px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .robot-svg {
            width: 125px;
            height: 125px;
            filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.15));
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            color: #1e40af;
        }
        .card-date {
            font-size: 0.9rem;
            color: #2563eb;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            color: #1e3a8a;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .todo-checkbox.checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .todo-text.completed {
            color: #93c5fd;
            text-decoration: line-through;
        }
        .todo-time {
            font-size: 0.9rem;
            color: #2563eb;
            font-weight: 500;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .status-bar {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-align: center;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(219, 234, 254, 0.5);
            border-radius: 14px;
            font-size: 14px;
            color: #1e3a8a;
            line-height: 1.4;
            white-space: pre-line;
        }
        .reminder-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            position: relative;
        }
        .reminder-bell {
            position: absolute;
            left: -8px;
            top: 12px;
            font-size: 1.4rem;
            transform: rotate(-15deg);
        }
        .reminder-body {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .reminder-label {
            font-size: 0.85rem;
            color: #4338ca;
            font-weight: bold;
        }
        .reminder-content-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }
        .reminder-time {
            font-size: 1.7rem;
            font-weight: bold;
            color: #1e3a8a;
            line-height: 1;
            flex-shrink: 0;
        }
        .reminder-divider {
            width: 2px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 12px;
            flex-shrink: 0;
        }
        .reminder-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            flex-grow: 1;
        }
        .badge-upcoming {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            gap: 12px;
        }
        .mic-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #60a5fa 0%, #2563eb 100%);
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-icon { width: 45px; height: 45px; fill: #ffffff; transition: fill 0.3s; }
        .mic-btn.recording { animation: pulse-red 1.5s infinite; background: radial-gradient(circle, #ff6b81 0%, #ff4757 100%); }
        .mic-btn.confirming { animation: pulse-teal 1.5s infinite; background: radial-gradient(circle, #2ed573 0%, #1ea896 100%); }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); transform: scale(1); } 70% { box-shadow: 0 0 0 22px rgba(255, 71, 87, 0); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); transform: scale(1); } }
        @keyframes pulse-teal { 0% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0.7); transform: scale(1); } 70% { box-shadow: 0 0 0 22px rgba(30, 168, 150, 0); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 rgba(30, 168, 150, 0); transform: scale(1); } }
        .voice-hint-text { font-size: 0.95rem; color: #2563eb; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .voice-hint-text::before, .voice-hint-text::after { content: ""; width: 15px; height: 2px; background-color: #bfdbfe; display: inline-block; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 75px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px 24px 0 0; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 500; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: #2563eb; }
    </style>
</head>
<body>
<div class="phone-container">
    <header class="header-section">
        <div class="greeting-box">
            <h1 class="greeting-title" id="greetingTitle">早安！ <span style="font-size: 1.5rem; color:#3b82f6;">💙</span></h1>
            <p class="greeting-sub" id="subTitle">今天也要加油喔！<br>點擊麥克風後開始說話...</p>
        </div>
        <div class="robot-illustration">
            <svg class="robot-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#dbeafe"/>
                    </linearGradient>
                    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#60a5fa"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                    </linearGradient>
                    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b"/>
                        <stop offset="100%" stop-color="#0f172a"/>
                    </linearGradient>
                </defs>
                <!-- 裝飾星星與愛心 -->
                <path d="M168 35 C168 30, 175 30, 175 35 C175 30, 182 30, 182 35 C182 42, 175 48, 175 48 C175 48, 168 42, 168 35 Z" fill="#fda4af" opacity="0.85"/>
                <circle cx="30" cy="48" r="3" fill="#93c5fd"/>
                <circle cx="178" cy="78" r="2.5" fill="#60a5fa"/>
                <!-- 天線 -->
                <line x1="100" y1="45" x2="100" y2="22" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
                <circle cx="100" cy="18" r="9" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
                <!-- 左右耳機 -->
                <rect x="24" y="75" width="22" height="52" rx="11" fill="url(#earGrad)" stroke="#1d4ed8" stroke-width="3"/>
                <rect x="154" y="75" width="22" height="52" rx="11" fill="url(#earGrad)" stroke="#1d4ed8" stroke-width="3"/>
                <circle cx="165" cy="101" r="7" fill="#bae6fd" opacity="0.8"/>
                <!-- 頭部主體 -->
                <rect x="40" y="45" width="120" height="102" rx="45" fill="url(#headGrad)" stroke="#3b82f6" stroke-width="4"/>
                <!-- 臉部螢幕 -->
                <rect x="54" y="64" width="92" height="64" rx="28" fill="url(#visorGrad)"/>
                <!-- 螢幕反光 -->
                <path d="M68 72 Q100 68 132 72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25"/>
                <!-- 微笑眼睛 -->
                <path d="M72 92 Q80 81 88 92" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
                <path d="M112 92 Q120 81 128 92" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
                <!-- 腮紅 -->
                <ellipse cx="69" cy="103" rx="6" ry="3.5" fill="#fb7185" opacity="0.7"/>
                <ellipse cx="131" cy="103" rx="6" ry="3.5" fill="#fb7185" opacity="0.7"/>
                <!-- 開心嘴巴 -->
                <path d="M91 104 Q100 116 109 104 Z" fill="#fb7185"/>
                <!-- 身體與胸前麥克風徽章 -->
                <path d="M65 147 C65 138, 135 138, 135 147 L142 175 C142 182, 58 182, 58 175 Z" fill="url(#headGrad)" stroke="#3b82f6" stroke-width="3.5"/>
                <circle cx="100" cy="162" r="14" fill="#3b82f6"/>
                <rect x="97" y="154" width="6" height="10" rx="3" fill="#ffffff"/>
                <path d="M93 161 A7 7 0 0 0 107 161" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
                <line x1="100" y1="168" x2="100" y2="171" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <!-- 雙手托腮 -->
                <ellipse cx="64" cy="144" rx="14" ry="11" fill="#ffffff" stroke="#3b82f6" stroke-width="3.5"/>
                <ellipse cx="136" cy="144" rx="14" ry="11" fill="#ffffff" stroke="#3b82f6" stroke-width="3.5"/>
            </svg>
        </div>
    </header>
    
    <main class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa-regular fa-calendar-days" style="color: #3b82f6; font-size: 1.3rem;"></i> 今日待辦</div>
            <div class="card-date" id="current-date">載入中...</div>
        </div>
        <div class="todo-list" id="todo-container"><p style="color: var(--text-muted); font-size: 0.9rem;">正在同步最新行程...</p></div>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="result" class="result-box">識別結果與解析會顯示在這裡...</div>
    </main>
    
    <div class="reminder-card">
        <div class="reminder-bell">🔔</div>
        <div class="reminder-body">
            <div class="reminder-label">下一個提醒</div>
            <div class="reminder-content-flex">
                <div class="reminder-time" id="next-time">--:--</div>
                <div class="reminder-divider"></div>
                <div class="reminder-text" id="next-task">目前暫無即將到來的提醒</div>
                <div class="badge-upcoming" id="next-badge">智慧助手</div>
            </div>
        </div>
    </div>
    
    <div class="voice-section">
        <button class="mic-btn" id="micButton">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
        </button>
        <div class="voice-hint-text" id="voiceHint">點擊麥克風開始</div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item active"><i class="fa-solid fa-house"></i><span>首頁</span></a>
        <a class="nav-item"><i class="fa-regular fa-square-check"></i><span>待辦</span></a>
        <a class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>統計</span></a>
        <a class="nav-item"><i class="fa-solid fa-gear"></i><span>設定</span></a>
    </nav>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHkvhdCOh3s834JA35-v44hMQvvcxagEjLuxiyVjeQAqfsow1Zq2c32zUl1XyBJPIMTg/exec";
    
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');
    const greetingTitle = document.getElementById('greetingTitle');
    const subTitle = document.getElementById('subTitle');
    const voiceHint = document.getElementById('voiceHint');
    const todoContainer = document.getElementById('todo-container');
    
    let recognition; 
    let isRecording = false; 
    let isConfirmStage = false; 
    let savedPendingData = null;

    // 1. 依時間自動更新問候語（早安 / 午安 / 晚安）
    function updateGreetingByTime() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) {
            greetingTitle.innerHTML = '早安！ <span style="font-size: 1.5rem; color:#3b82f6;">💙</span>';
            subTitle.innerHTML = '今天也要加油喔！<br>點擊麥克風後開始說話...';
        } else if (hour >= 12 && hour < 18) {
            greetingTitle.innerHTML = '午安！ <span style="font-size: 1.5rem; color:#f59e0b;">☀️</span>';
            subTitle.innerHTML = '下午也要保持活力喔！<br>有什麼需要我幫忙的嗎？';
        } else {
            greetingTitle.innerHTML = '晚安！ <span style="font-size: 1.5rem; color:#6366f1;">🌙</span>';
            subTitle.innerHTML = '辛苦一天了！<br>明天有什麼行程要記錄嗎？';
        }
    }

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

    // 2. 智慧挑選「時間距離現在最近」的未來一筆提醒
    function updateClosestReminder(todos) {
        const nextTimeEl = document.getElementById('next-time');
        const nextTaskEl = document.getElementById('next-task');
        const nextBadgeEl = document.getElementById('next-badge');

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        // 過濾出未完成且帶有 HH:MM 格式時間的項目
        const validUpcoming = todos
            .filter(t => !t.done && t.time && /^\d{1,2}:\d{2}$/.test(t.time.trim()))
            .map(t => {
                const parts = t.time.trim().split(':');
                const mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                return { ...t, totalMinutes: mins };
            })
            .filter(t => t.totalMinutes >= currentMinutes) // 只保留尚未過期的提醒
            .sort((a, b) => a.totalMinutes - b.totalMinutes); // 依照時間由近到遠排序

        if (validUpcoming.length > 0) {
            const closest = validUpcoming[0];
            nextTimeEl.innerText = closest.time.trim();
            nextTaskEl.innerText = closest.title;
            nextBadgeEl.innerText = (closest.totalMinutes - currentMinutes <= 60) ? "即將開始" : "距離最近";
        } else {
            nextTimeEl.innerText = "--:--";
            nextTaskEl.innerText = "今日提醒已全數完成 ✨";
            nextBadgeEl.innerText = "智慧助手";
        }
    }

    async function fetchAndRenderTodos() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const data = await response.json();
            if (data && data.todos && data.todos.length > 0) {
                if (data.date) document.getElementById('current-date').innerText = data.date;
                todoContainer.innerHTML = '';
                data.todos.forEach(todo => {
                    todoContainer.innerHTML += `
                        <div class="todo-item">
                            <div class="todo-left">
                                <div class="todo-checkbox ${todo.done ? 'checked' : ''}">
                                    ${todo.done ? '<i class="fa-solid fa-check"></i>' : ''}
                                </div>
                                <span class="todo-text ${todo.done ? 'completed' : ''}">${todo.title}</span>
                            </div>
                            ${todo.time ? `<div class="todo-time">${todo.time}</div>` : ''}
                        </div>
                    `;
                });
                updateClosestReminder(data.todos);
            } else {
                loadLocalMockData();
            }
        } catch (error) {
            loadLocalMockData();
        }
    }

    function loadLocalMockData() {
        const mockTodos = [
            { title: "開會討論專案進度", time: "09:30", done: false }, 
            { title: "閱讀一本好書 💕", time: "", done: true }, 
            { title: "運動 30 分鐘", time: "18:00", done: false }, 
            { title: "準備晚餐", time: "19:30", done: false }
        ];
        todoContainer.innerHTML = '';
        mockTodos.forEach(todo => {
            todoContainer.innerHTML += `
                <div class="todo-item">
                    <div class="todo-left">
                        <div class="todo-checkbox ${todo.done ? 'checked' : ''}">
                            ${todo.done ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <span class="todo-text ${todo.done ? 'completed' : ''}">${todo.title}</span>
                    </div>
                    ${todo.time ? `<div class="todo-time">${todo.time}</div>` : ''}
                </div>
            `;
        });
        updateClosestReminder(mockTodos);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition(); 
        recognition.continuous = false; 
        recognition.lang = 'zh-TW';
        
        recognition.onstart = () => {
            isRecording = true;
            if (isConfirmStage) { 
                micButton.classList.remove('recording'); 
                micButton.classList.add('confirming'); 
                statusText.innerText = "請回答「對」或「不對」..."; 
                voiceHint.innerText = "聆聽確認語音中"; 
            } else { 
                micButton.classList.remove('confirming'); 
                micButton.classList.add('recording'); 
                statusText.innerText = "正在聆聽中，請說話..."; 
                voiceHint.innerText = "正在聆聽您的指令"; 
            }
        };
        
        recognition.onend = () => { 
            isRecording = false; 
            micButton.classList.remove('recording'); 
            micButton.classList.remove('confirming'); 
        };
        
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript.trim();
            if (isConfirmStage) { 
                handleConfirmation(text); 
            } else { 
                resultText.innerText = "聽到指令：" + text; 
                parseCommand(text); 
            }
        };
        
        recognition.onerror = () => { 
            statusText.innerText = "語音識別出錯，請再試一次"; 
            resetToInitial(); 
        };
    } else { 
        statusText.innerText = "瀏覽器不支援語音辨識"; 
        micButton.style.display = 'none'; 
    }

    micButton.addEventListener('click', () => { 
        if (isRecording) { 
            recognition.stop(); 
        } else { 
            recognition.start(); 
        } 
    });

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message); 
            utterance.lang = 'zh-TW'; 
            utterance.rate = 1.0;
            if (callback) { 
                utterance.onend = callback; 
            }
            window.speechSynthesis.speak(utterance);
        } else if (callback) { 
            callback(); 
        }
    }

    function parseCommand(text) {
        statusText.innerText = "AI 正在分析語意..."; 
        let pendingData = null;
        
        if (text.includes("花") || text.includes("買") || text.includes("元") || text.includes("塊")) {
            const amountMatch = text.match(/\d+/);
            if (amountMatch) { 
                const amount = amountMatch[0]; 
                const content = text.replace(amount, "").replace(/元|塊|今日|今天/g, "").trim(); 
                pendingData = { mode: 'expense', content: content || "日常花費", amount: amount, rawText: text }; 
            }
        } else if (text.includes("提醒") || text.includes("叫我")) {
            let dateStr = new Date().toISOString().split('T')[0]; 
            let timeStr = "09:00";
            const dateMatch = text.match(/(\d+)月(\d+)號?/);
            if (dateMatch) { 
                const currentYear = new Date().getFullYear(); 
                dateStr = `${currentYear}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`; 
            } else if (text.includes("明天")) { 
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); 
                dateStr = tomorrow.toISOString().split('T')[0]; 
            }
            const timeMatch = text.match(/(\d+)點(\d+)?/);
            if (timeMatch) { 
                let hour = parseInt(timeMatch[1]); 
                let minute = timeMatch[2] ? timeMatch[2] : "00"; 
                if ((text.includes("下午") || text.includes("晚上") || text.includes("pm") || text.includes("PM")) && hour < 12) { hour += 12; } 
                timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`; 
            }
            pendingData = { mode: 'reminder', content: text, date: dateStr, time: timeStr, rawText: text };
        }
        
        if (pendingData) {
            savedPendingData = pendingData; 
            isConfirmStage = true; 
            statusText.innerText = "🔊 正在語音確認中..."; 
            voiceHint.innerText = "請準備回答對或不對";
            const askMsg = `確認內容，請問是要記錄：${text}，對嗎？`; 
            speak(askMsg, () => { if (!isRecording) { recognition.start(); } });
        } else { 
            statusText.innerText = "❌ 無法辨識指令，請重新說一次。"; 
            speak("抱歉，我沒有聽懂，請重新說一次。"); 
            voiceHint.innerText = "點擊麥克風重新開始"; 
        }
    }

    // 💡 核心確認判斷函數
    function handleConfirmation(text) {
        resultText.innerText = "您的確認回答：" + text;

        // 1. 🔍 優先判定「拒絕語意」：包含 不、錯、取消、改，立刻阻斷！
        if (text.includes("不") || text.includes("錯") || text.includes("取消") || text.includes("改")) {
            statusText.innerText = "❌ 已取消記錄。";
            voiceHint.innerText = "點擊麥克風重新開始";
            speak("好的，已幫您取消，請重新點擊按鈕錄製。", function() {
                resetToInitial();
            });
            return; // 🎯 關鍵阻斷點：直接退出，絕對不會觸發下方的 sendToGas
        }

        // 2. 🔍 確定排除拒絕詞後，才判定「同意語意」
        if (text.includes("對") || text.includes("是") || text.includes("正確") || text.includes("好") || text.includes("ok") || text.includes("OK")) {
            if (!savedPendingData) {
                resetToInitial();
                return;
            }
            statusText.innerText = "🚀 確認正確，正在同步至雲端...";
            voiceHint.innerText = "同步至後端中";
            speak("收到，正在幫您寫入文件。");
            sendToGas(savedPendingData);
        } else {
            // 如果使用者講了不相干的話，要求重新確認
            statusText.innerText = "❓ 請清楚回答「對」或「不對」";
            speak("抱歉，請清楚回答對、或者不對。", function() {
                if (!isRecording) recognition.start();
            });
        }
    }

    // 💡 優化後的重置函數：全面恢復按鈕動畫與文字狀態
    function resetToInitial() {
        isConfirmStage = false;
        savedPendingData = null;
        statusText.innerText = "準備就緒";
        resultText.innerText = "識別結果與解析會顯示在這裡...";
        updateGreetingByTime();
        voiceHint.innerText = "點擊麥克風開始";
        micButton.classList.remove('recording');
        micButton.classList.remove('confirming');
    }

    // 💡 傳送至後端 GAS 的函數
    function sendToGas(data) {
        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(data) 
        })
        .then(function() {
            statusText.innerText = "✅ 處理完成！已成功存入文件。";
            resultText.innerText = "[已記錄]\n類型: " + (data.mode === 'expense' ? '記帳' : '提醒事項') + "\n內容: " + data.content;
            speak("已成功存入文件，大功告成。", function() {
                // 成功寫入並說完話 3 秒後，自動全面重置網頁狀態並重新抓取最新待辦清單
                setTimeout(() => {
                    resetToInitial();
                    fetchAndRenderTodos();
                }, 3000);
            });
        })
        .catch(function(err) { 
            statusText.innerText = "❌ 傳送失敗"; 
            speak("糟糕，傳送失敗了。");
            console.error(err); 
            resetToInitial();
        });
    }

    window.addEventListener('DOMContentLoaded', () => { 
        updateGreetingByTime();
        fetchAndRenderTodos(); 
    });
</script>
